<script>const {
  useState,

/* ============================================================
   GAS 피드백 파이프 — v0.7 재구현 (제안/신호/텔레메트리)
   ============================================================ */
/* 플레이테스트 빌드 태그 — 테스트 중 버전 구분용. 수정할 때마다 뒤 번호를 올린다. */
const BUILD = "v0.7.3-pt36";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxFx_m5rhCZmqGoy3JcUUNqEgiObMWNHe9hx-LnZrhzIkfwa9-yJGBWP0lVulptnNQeCQ/exec";
function gasPost(payload, options = {}) {
  return fetch(GAS_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload),
    keepalive: !!options.keepalive
  }).then(r => r.text()).then(t => String(t).indexOf("ok") >= 0);
}
function tele(event, scene, who, extra, keepalive = false) {
  try {
    gasPost({
      type: "telemetry",
      scene: scene || "",
      who: who || "",
      text: event,
      extra: extra || ""
    }, {keepalive}).catch(() => {});
  } catch (e) {}
}

// Small, framework-independent clock: it measures visible, actionable time,
// including reading time. It does not claim to measure thought or attention.
function createDecisionClock(now = () => typeof performance !== "undefined" ? performance.now() : Date.now()) {
  let key = null, elapsed = 0, since = null, measured = false;
  function pause() {
    if (since !== null) elapsed += Math.max(0, now() - since);
    since = null;
  }
  return {
    sync(nextKey, paused) {
      if (nextKey !== key) { pause(); key = nextKey; elapsed = 0; measured = !!key; }
      if (!key || paused) pause();
      else if (since === null) since = now();
    },
    read(expectedKey) {
      if (!measured || key !== expectedKey) return null;
      return Math.round(elapsed + (since === null ? 0 : Math.max(0, now() - since)));
    },
    pause
  };
}
function telemetryId(prefix) {
  const random = typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"
    ? crypto.randomUUID().replace(/-/g, "").slice(0, 12)
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return prefix + random;
}
function telemetryPlayer() {
  let id = store.get("aduventure_anon_player");
  if (typeof id !== "string" || !/^p[a-z0-9]{8,20}$/i.test(id)) {
    id = telemetryId("p");
    store.set("aduventure_anon_player", id);
  }
  return id;
}
function newTelemetryRun(previous) {
  return {id: telemetryId("r"), seq: 0, player: telemetryPlayer(), previous: previous || undefined};
}
function restoreTelemetryRun(saved) {
  if (!saved || typeof saved.id !== "string" || !/^r[a-z0-9]{8,20}$/i.test(saved.id)) return newTelemetryRun();
  return {id: saved.id, seq: Number.isSafeInteger(saved.seq) && saved.seq >= 0 ? saved.seq : 0, player: telemetryPlayer()};
}
function encodeTelemetry(data) {
  const text = JSON.stringify(data);
  // Do not send invalid/truncated JSON through the legacy six-column GAS sink.
  return text.length <= 950 ? text : null;
}
function emitTelemetry(event, run, data, keepalive = false) {
  try {
    if (!run) return;
    const extra = encodeTelemetry({v: 1, build: BUILD, run_id: run.id, player_id: run.player, ...data});
    if (extra) tele(event, data.scene_id, run.player, extra, keepalive);
  } catch (e) { /* Analytics must never stop a game. */ }
}
function reportClientError(msg, extra) {
  try {
    gasPost({
      type: "error",
      build: BUILD,
      text: String(msg || "unknown"),
      extra: extra || "",
      at: new Date().toISOString()
    }).catch(() => {});
  } catch (e) {}
}
if (typeof window !== "undefined") {
  const wakeSound = () => BGM.wake();
  window.addEventListener("pointerdown", wakeSound);
  window.addEventListener("keydown", wakeSound);
  window.addEventListener("error", function (e) {
    reportClientError(e.message, (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    reportClientError(String(e.reason), "unhandledrejection");
  });
}

   ============================================================ */
const memStore = {};
const store = {
  get(k) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : memStore[k] ?? null;
    } catch (e) {
      return memStore[k] ?? null;
    }
  },
  set(k, v) {
    memStore[k] = v;
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
  },
  remove(k) {
    delete memStore[k];
    try {
      localStorage.removeItem(k);
    } catch (e) {}
  }
};

let _ac = null;
function _ctx() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === "suspended") _ac.resume();
  return _ac;
}
const SFX = {
  enabled: false,
  toggle() {
    this.enabled = !this.enabled;
    try {
      this.enabled ? BGM.start() : BGM.stop();
    } catch (e) {}
    return this.enabled;
  },
  _tone(freq, t0, dur, vol, type) {
    const c = _ctx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(c.currentTime + t0);
    o.stop(c.currentTime + t0 + dur + 0.05);
  },
  // 짧게 걸러진 잡음 한 번(바람·물·군중·긁힘의 재료)
  _noise(t0, dur, vol, type, freq, freqEnd) {
    const c = _ctx();
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, c.currentTime + t0);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, c.currentTime + t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
    src.connect(f);
    f.connect(g);
    g.connect(c.destination);
    src.start(c.currentTime + t0);
    src.stop(c.currentTime + t0 + dur + 0.05);
  },
  // 상황 효과음 — 장면 진입·단서 획득 때 한 번
  cue(name) {
    if (!this.enabled || !name) return;
    try {
      if (name === "door") { this._tone(95, 0, 0.5, 0.05, "sawtooth"); this._tone(70, 0.18, 0.5, 0.04, "sawtooth"); this._noise(0, 0.35, 0.05, "bandpass", 500); }
      else if (name === "wind") this._noise(0, 1.6, 0.06, "bandpass", 300, 900);
      else if (name === "clash") { this._noise(0, 0.12, 0.12, "highpass", 2500); this._tone(1250, 0, 0.35, 0.05, "triangle"); this._tone(1870, 0.02, 0.25, 0.03, "triangle"); }
      else if (name === "gear") [0, 0.16, 0.32].forEach(t => { this._tone(900, t, 0.06, 0.05, "square"); this._noise(t, 0.05, 0.05, "highpass", 3000); });
      else if (name === "fire") this._noise(0, 1.2, 0.07, "lowpass", 900, 300);
      else if (name === "crowd") this._noise(0, 1.4, 0.05, "bandpass", 650);
      else if (name === "water") this._noise(0, 1.8, 0.09, "lowpass", 250, 1200);
      else if (name === "thud") this._tone(65, 0, 0.3, 0.12, "sine");
      else if (name === "pen") [0, 0.09, 0.2].forEach(t => this._noise(t, 0.07, 0.05, "highpass", 4000));
    } catch (e) {}
  },
  dice() {
    if (!this.enabled) return;
    try {
      for (let i = 0; i < 5; i++) this._tone(160 + Math.random() * 240, i * 0.07, 0.05, 0.05, "square");
    } catch (e) {}
  },
  good() {
    if (!this.enabled) return;
    try {
      this._tone(523, 0, 0.18, 0.07);
      this._tone(784, 0.12, 0.3, 0.07);
    } catch (e) {}
  },
  bad() {
    if (!this.enabled) return;
    try {
      this._tone(140, 0, 0.35, 0.09, "triangle");
      this._tone(90, 0.1, 0.4, 0.08, "triangle");
    } catch (e) {}
  },
  bell() {
    if (!this.enabled) return;
    try {
      [0, 1.4, 2.8].forEach(t => {
        this._tone(660, t, 1.3, 0.08);
        this._tone(1320, t, 0.9, 0.03);
        this._tone(440, t, 1.6, 0.05);
      });
    } catch (e) {}
  }
};

const SRD20 = {
  scaleEffect: value => Math.max(0, value),
  rollDamage({ die, bonus = 0, critical = false }) {
    return this.scaleEffect(d(die) + (critical ? d(die) : 0) + bonus);
  },
  rollRecovery(profile) { return this.rollDamage(profile); },
  damageRange({ die, bonus = 0 }) { return [this.scaleEffect(1 + bonus), this.scaleEffect(die + bonus)]; },
  name: { ko: "SRD d20", en: "SRD d20" },
  desc: { ko: "d20 + 보정치 + 숙련(+2) vs DC", en: "d20 + modifier + proficiency (+2) vs DC" },
  tutorial: {
    ko: ["⓪ 판정은 높이뛰기다. 난이도(DC)는 가로 바의 높이, 주사위는 그날의 운, 보정은 평소 실력 — 합쳐서 바를 넘으면 성공.", "① 20면 주사위(d20)를 굴린다 — 1부터 20까지 모두 같은 확률(균등분포).", "② 능력치 보정을 더한다. 보정 = (능력치−10)÷2 내림.", "③ 숙련 기능이면 +2를 더한다.", "★ 20은 무조건 성공, 1은 무조건 실패. 렌의 예고 공격은 20에 자동 명중하지만 치명타 피해는 추가하지 않습니다."],
    en: ["⓪ A check is a high jump. The DC is the bar, the die is that day's luck, the modifier is your usual skill — together they clear the bar.", "① Roll a twenty-sided die (d20). Every face from 1 to 20 is equally likely.", "② Add your ability modifier. Modifier = floor((score − 10) ÷ 2).", "③ If you're proficient in the skill, add +2.", "★ A 20 always succeeds. A 1 always fails. Ren's telegraphed attacks automatically hit on 20 but gain no critical damage."]
  },
  abilityMod: s => Math.floor((s - 10) / 2),
  successChance({
    actor,
    ability,
    skill,
    dc
  }) {
    const mod = this.abilityMod(actor.abilities[ability]);
    const prof = skill && actor.proficiencies.includes(skill) ? 2 : 0;
    let n = 0;
    for (let r = 1; r <= 20; r++) if (r === 20 || r !== 1 && r + mod + prof >= dc) n++;
    return n / 20;
  },
  check({
    actor,
    ability,
    skill,
    dc
  }) {
    const roll = d(20);
    const mod = this.abilityMod(actor.abilities[ability]);
    const prof = skill && actor.proficiencies.includes(skill) ? 2 : 0;
    const total = roll + mod + prof;
    const success = roll === 20 ? true : roll === 1 ? false : total >= dc;
    return {
      roll,
      total,
      dc,
      success,
      detail: bi(`주사위 ${roll} ${mod >= 0 ? "+" : ""}${mod} 보정${prof ? " +2 숙련" : ""} = ${total} → 장애물 ${dc}`, `Die ${roll} ${mod >= 0 ? "+" : ""}${mod} mod${prof ? " +2 prof" : ""} = ${total} → DC ${dc}`)
    };
  },
  attack({
    attacker,
    defender,
    damageProfile
  }) {
    const roll = d(20);
    const w = attacker.weapon;
    const mod = this.abilityMod(attacker.abilities[w.ability]);
    const total = roll + mod + 2;
    const crit = roll === 20;
    const hit = crit ? true : roll === 1 ? false : total >= defender.ac;
    // Intent damage is a separate profile: a natural maximum guarantees a hit,
    // but does not double a telegraphed move's damage.
    const damage = hit ? this.rollDamage(damageProfile || { die: w.die, bonus: Math.max(0, mod), critical: crit }) : 0;
    return {
      roll,
      total,
      hit,
      damage,
      crit,
      detail: crit ? (damageProfile ? bi(`주사위 20 자동 명중 — ${damage} 피해`, `Natural 20 — automatic hit, ${damage} damage`) : bi(`주사위 20 치명타! ${wname(w, "ko")} ${damage} 피해`, `Natural 20 — critical! ${wname(w, "en")} deals ${damage}`)) : hit ? bi(`주사위 ${roll}+${mod + 2}=${total} ≥ 방어 ${defender.ac} 명중 — ${damage} 피해`, `Die ${roll}+${mod + 2}=${total} ≥ AC ${defender.ac} — hit, ${damage} damage`) : bi(`주사위 ${roll}+${mod + 2}=${total} < 방어 ${defender.ac} 빗나감`, `Die ${roll}+${mod + 2}=${total} < AC ${defender.ac} — miss`)
    };
  }

  desc: { ko: "2d6 + 보정치 vs 목표값 (종형 분포)", en: "2d6 + modifier vs target (a bell curve)" },
  tutorial: {
    ko: ["⓪ 판정은 높이뛰기다. 목표값은 가로 바의 높이 — 주사위+보정으로 바를 넘으면 성공.", "① 6면 주사위 두 개의 합 — 7 근처가 잘 나오고 2·12는 드물다(종형분포).", "② 보정 = (능력치−10)÷3 내림, 숙련이면 +1.", "③ 전투는 2d6+보정+숙련 1을 AC×0.55 반올림(최소 4)과 비교합니다. 기본 피해는 (무기 주사위+양수 보정)÷2 올림, 치명타는 +2입니다. 특수 피해·회복·반격 보너스도 절반으로 환산합니다.", "★ 합 12는 무조건 성공, 2는 무조건 실패. 렌의 예고 공격은 자동 명중만 적용하고 치명타 피해를 더하지 않습니다.", "※ 물리 질문: 같은 모험인데 왜 d20과 분포가 다를까?"],
    en: ["⓪ A check is a high jump. The target is the bar — die plus modifier clears it and you succeed.", "① The sum of two six-sided dice. Near 7 is common; 2 and 12 are rare (a bell curve).", "② Modifier = floor((score − 10) ÷ 3). Add +1 if proficient.", "③ Combat compares 2d6 + modifier + 1 proficiency against AC × 0.55, rounded (minimum 4). Basic damage is (weapon die + positive modifier) ÷ 2, rounded up; a critical adds 2. Special damage, recovery and riposte bonuses are also scaled to half.", "★ A sum of 12 always succeeds. A 2 always fails. Ren's telegraphed attacks automatically hit on 12 but gain no critical damage.", "※ A physics question: same adventure — why is the spread different from a d20?"]
  },
  abilityMod: s => Math.floor((s - 10) / 3),
  toTarget: dc => Math.max(4, Math.round(dc * 0.55)),
  successChance({
    actor,
    ability,
    skill,
    dc
  }) {
    const mod = this.abilityMod(actor.abilities[ability]);
    const prof = skill && actor.proficiencies.includes(skill) ? 1 : 0;
    const t = this.toTarget(dc);
    let ways = 0;
    for (let s = 2; s <= 12; s++) if (s === 12 || s !== 2 && s + mod + prof >= t) ways += WAYS[s];
    return ways / 36;
  },
  check({

    ability,
    skill,
    dc
  }) {
    const r1 = d(6),
      r2 = d(6),
      roll = r1 + r2;
    const mod = this.abilityMod(actor.abilities[ability]);
    const prof = skill && actor.proficiencies.includes(skill) ? 1 : 0;
    const total = roll + mod + prof;
    const target = this.toTarget(dc);
    const success = roll === 12 ? true : roll === 2 ? false : total >= target;
    return {
      roll,
      total,
      dc: target,
      success,
      detail: bi(`주사위 ${r1}+${r2}=${roll} ${mod >= 0 ? "+" : ""}${mod} 보정${prof ? " +1 숙련" : ""} = ${total} → 장애물 ${target}`, `Dice ${r1}+${r2}=${roll} ${mod >= 0 ? "+" : ""}${mod} mod${prof ? " +1 prof" : ""} = ${total} → DC ${target}`)

      hit,
      damage,
      crit,

    };
  }

  // 사람과 물건 중 하나만 붙잡을 수 있다 — 렌을 붙잡으면 렌즈에 금이 가고, 렌즈를 붙잡으면 렌이 떨어진다.
  railing: {
    ch: 1,
    text: {
      ko: `손은 하나뿐이다.\n\n왼쪽, 난간에 손가락 끝으로 매달린 렌. 오른쪽, 계단통으로 미끄러지는 황동 렌즈 자루.\n\n아래는 열두 칸 아래의 돌바닥이다.`,
      en: `You have one free hand.\n\nTo the left, Ren hangs from the railing by his fingertips. To the right, the brass lens sack slides toward the stairwell.\n\nBelow is a stone floor, twelve steps down.`
    },
    choices: [{
      label: {
        ko: "렌의 손목을 잡는다 — 사람을 택한다",
        en: "Grab Ren's wrist — choose the man"
      },
      stake: { ko: "렌즈에 금이 간다 · 2장에서 렌이 빚을 갚는다", en: "The lens cracks · Ren repays you in Ch.2" },
      result: {
        text: {
          ko: `렌을 끌어올린다. 아래에서 쨍 — 렌즈가 돌바닥에 부딪혔다.\n\n렌이 숨을 몰아쉰다. "…왜." 대답 대신 손을 놓는다.\n\n돌아서던 렌이 중얼거린다. "베른 영감이 날 불렀어. 렌즈를 가져오면 값을 쳐주겠다고. 왜 그랬는지는 나도 몰라." 렌은 이번엔 뛰지 않고 걸어서 나간다.\n\n주워 온 렌즈에 금이 갔다. 불은 켜지겠지만 — 전처럼 멀리 닿진 않을 것이다.`,
          en: `You haul Ren up. Below, a crack — the lens hits the stone.\n\nRen gasps for breath. "…why." Instead of answering, you let go.\n\nTurning away, Ren mutters, "Old Bern sent for me. Said he'd pay if I brought him the lens. Don't ask me why." This time he doesn't run. He walks out.\n\nThe lens you bring back up is cracked. It will still light — but it won't reach as far as it used to.`
        },
        flags: ["caughtRen", "lensCracked", "f_ren_keeper"],
        goto: "top"
      }
    }, {
      label: {
        ko: "렌즈 자루를 잡는다 — 등대를 택한다",
        en: "Grab the lens sack — choose the lighthouse"
      },
      stake: { ko: "렌즈는 온전하다 · 렌은 떨어지고 원한을 품는다", en: "The lens stays whole · Ren falls and holds a grudge" },
      result: {
        text: {
          ko: `자루를 낚아챈다. 렌의 손가락이 난간에서 미끄러진다 — 둔탁한 소리.\n\n아래층에서 신음이 들리더니, 절뚝이는 발소리가 빗속으로 멀어진다.\n\n렌즈는 무사하다. 렌의 눈빛은, 아마 아닐 것이다.\n\n자루 바닥에 접힌 종이 한 장 — '촌장실 비품 반출 확인. 세온.' 렌즈를 처음 꺼낸 건 렌이 아니었다.`,
          en: `You snatch the sack. Ren's fingers slip from the railing — a dull thud.\n\nA groan from below, then limping footsteps fading into the rain.\n\nThe lens is unharmed. Ren's look, probably not.\n\nFolded at the bottom of the sack, a slip: "Removal from the chief's office approved. — Seon." Ren wasn't the first to take the lens out.`
        },
        flags: ["keptLens", "f_receipt"],
        goto: "top"
      }
    }, {
      "classOnly": "fighter",
      "label": {
        "ko": "한 손엔 렌의 손목, 한 손엔 자루 — 둘 다 붙든다",
        "en": "Ren's wrist in one hand, the sack in the other — hold on to both"

        "dc": 14,

          "en": "Your shoulder feels ready to tear. You don't let go.\n\nRen's wrist in your left hand, the lens sack in your right. Teeth clenched, you haul both back over the railing.\n\nRen gasps for breath. \"…Madman. Old Bern wanted to buy this lens. Ask him.\"\n\nA wet slip pokes out of the sack: removal approved by the chief's office — signed, Seon."

        "goto": "top",
        "flags": [

          "f_ren_keeper",

          "en": "It was greed. The sack's weight twists your wrist —\n\nthe sack slips first and slams the stairwell wall, and Ren's wrist slides through your fingers. A dull thud below, then the sound of glass cracking.\n\nYou lost both. By the time you fetch the cracked lens, Ren has limped off into the dark."

        ],
        "ifDown": "signal",
        "goto": "top",
        "flags": [
          "keptLens",
          "lensCracked"
        ]
      }
    }
    ]
  },

      en: `The next morning. Bern, the old keeper, has come to.\n\n"Struck from behind. A black coat… ran off toward the harbor."\n\nWhoever put out the light was a person. And they're still in town.`

    choices: [{
      label: {
        ko: "부두로 간다",
        en: "Head to the docks"

      goto: "dawn2"
    }, {

      caseMin: 3,
      frag: "f_bern_lied",
      label: {
        ko: `[기억] 베른에게 묻는다. "정말 검은 코트였습니까?"`,
        en: `[Memory] Ask Bern. "Was it really a black coat?"`

      result: {
        text: {
          ko: `베른이 오래 창밖을 본다.\n\n"…검은 코트는 못 봤네. 톱니를 빼라고 한 사람이 있었지. 렌즈도 잠깐 치워 두라고. 이름은 말 못 하네."\n\n목소리가 떨린다. "이 마을이 겨울을 나려면, 등대가 꺼지는 밤이 필요했어."`,
          en: `Bern stares out the window for a long time.\n\n"…I never saw a black coat. Someone told me to pull the gear. To put the lens away for a while. I can't say the name."\n\nHis voice shakes. "For this village to survive the winter, it needed nights when the light went dark."`
        },
        flags: ["f_bern_lied"],
        goto: "dawn2"
      }
    }]

  dawn2: {
    "ch": 2,
    "text": {
      "ko": "부두 선술집은 해가 져야 문을 연다. 그 전에 들를 수 있는 곳은 두 군데뿐이다.\n\n세관 사무소, 기름 가게, 베른의 오두막, 그리고 언덕 위 촌장 집.\n\n어디서 무엇을 듣느냐에 따라, 오늘 밤 쓸 수 있는 수가 달라진다.",
      "en": "The dockside tavern only opens at sundown. Before then, there's time for two stops.\n\nThe customs office, the oil shop, Bern's cottage, and the chief's house up the hill.\n\nWhat you hear, and where, decides what you can play tonight."
    },
    "choices": [
      {
        "lead": "leadManifest",
        "label": {
          "ko": "세관 사무소 — 어젯밤 입항 기록을 들여다본다",
          "en": "The customs office — look over last night's harbor log"
        },
        "stake": {
          "ko": "오늘 밤 부두에서: 기록의 빈칸을 들이밀 수 있다",
          "en": "Tonight at the docks: you can press on a gap in the log"
        },
        "result": {
          "text": {
            "ko": "졸던 서기가 황급히 장부를 덮는다. 덮이기 직전, 한 줄이 보였다.\n\n'3번 창고 — 입고 물품 없음.'\n\n잉크가 아직 젖어 있다. 오늘 아침에 고쳐 쓴 줄이다.",
            "en": "The dozing clerk slams the log shut. Just before it closes, you catch one line.\n\n'Warehouse 3 — no goods received.'\n\nThe ink is still wet. Someone rewrote that line this morning."
          },
          "flags": [
            "leadManifest"
          ],
          "goto": "dawn2b"
        }
      },
      {
        "lead": "leadOil",
        "label": {
          "ko": "기름 가게 — 램프 기름 한 병을 산다",
          "en": "The oil shop — buy a flask of lamp oil"
        },
        "stake": {
          "ko": "오늘 밤 싸움에서: 바닥에 기름을 쏟을 수 있다",
          "en": "In tonight's fight: you can spill oil on the floor"
        },
        "result": {
          "text": {
            "ko": "주인이 병을 건네며 혀를 찬다. \"요새 기름이 잘 나가. 어제는 검은 코트 양반이 한 통을 통째로 사 갔지. 창고 등불용이라나.\"\n\n묵직한 병이 주머니 안에서 출렁인다.",
            "en": "The owner hands over the flask and clicks his tongue. \"Oil's selling well lately. Yesterday a fellow in a black coat bought a whole barrel. For the warehouse lamps, he said.\"\n\nThe heavy flask sloshes in your pocket."
          },
          "flags": [
            "leadOil"
          ],
          "goto": "dawn2b"
        }
      },
      {
        "lead": "leadBern",
        "label": {
          "ko": "베른의 오두막 — 노인이 없는 사이 둘러본다",
          "en": "Bern's cottage — look around while the old man is out"
        },
        "stake": {
          "ko": "스컬리를 몰아세울 때: 내밀 종이 한 장이 생긴다",
          "en": "When you corner Scully: you'll have a slip to show him"
        },
        "result": {
          "text": {
            "ko": "침대 밑 상자. 동전 꾸러미와, 꼬깃꼬깃한 영수증 한 장.\n\n'소금여울 공동 기금 — 등대 비용 일부.'\n\n렌즈 값을 모으던 노인의 돈이, 누군가의 기금으로 흘러가고 있었다.",
            "en": "A box under the bed. A bundle of coins, and one crumpled receipt.\n\n'Saltmarsh Common Fund — lighthouse costs, partial.'\n\nThe money the old man was saving for the lens had been flowing into someone's fund."
          },
          "flags": [
            "leadBern"
          ],
          "goto": "dawn2b"
        }
      },
      {
        "lead": "leadWindow",
        "label": {
          "ko": "언덕 위 촌장 집 — 인사차 들른다",
          "en": "The chief's house on the hill — drop by to pay respects"
        },
        "stake": {
          "ko": "매복에 걸렸을 때: 신호를 흉내 낼 수 있다",
          "en": "If you walk into the ambush: you can mimic a signal"
        },
        "result": {
          "text": {
            "ko": "세온이 직접 문을 연다. \"어제는 수고했네.\" 미소가 지나치게 반듯하다.\n\n돌아 나오며 올려다본 2층 창문. 덧문 안쪽에 소금이 엉긴 신호등이 걸려 있다. 등불을 두 번 가렸다 여는 손잡이까지.",
            "en": "Seon opens the door himself. \"Good work last night.\" The smile is a little too practiced.\n\nOn your way out you glance up at the second-floor window. Behind the shutter hangs a salt-crusted signal lamp — with a handle to cover the light twice and open it again."
          },
          "flags": [
            "leadWindow"
          ],
          "goto": "dawn2b"
        }
      },
      {
        "label": {
          "ko": "탐문은 건너뛰고 곧장 부두로 간다",
          "en": "Skip the rounds and head straight to the docks"
        },
        "goto": "wharf"
      }
    ]
  },

  /* ---------- 스컬리와의 결투(2장) — 빠른 단검. 2박: 사람을 잡을까, 편지를 잡을까(3장 수문의 예고) ---------- */
  scully1: {
    ch: 2,
    text: {
      ko: `스컬리의 단검이 등불 빛을 받아 번쩍인다. 몸이 가볍다 — 찌르고 빠지는 놈이다.\n\n탁자 위에는 장부와 편지 뭉치. 스컬리의 눈이 자꾸 그쪽으로 간다.`,
      en: `Scully's dagger flashes in the lamplight. He's light on his feet — a stab-and-slip fighter.\n\nOn the table, a ledger and a bundle of letters. His eyes keep drifting toward them.`
    },
    choices: [{
      label: { ko: "[지각] 찌르는 박자를 읽고 손목을 잡는다", en: "[Perception] Read the rhythm of his thrusts and catch the wrist" },
      stake: { ko: "성공하면 다음 수가 쉬워진다 · 실패하면 칼이 들어온다", en: "Success makes the next move easier · failure lets the blade in" },
      check: { ability: "WIS", skill: "perception", dc: 12, label: "지각" },
      success: { text: { ko: `세 번째 찌르기 직전, 손목을 낚아챈다. 스컬리의 얼굴이 굳는다.`, en: `Right before the third thrust, you snatch his wrist. Scully's face goes stiff.` }, flags: ["duelEdge2"], goto: "scully2" },
      fail: { text: { ko: `박자를 놓쳤다. 단검이 팔뚝을 가르고 빠진다.`, en: `You miss the beat. The dagger opens your forearm and slips away.` }, damage: [2, 4], ifDown: "gameover", goto: "scully2" }
    }, {
      label: { ko: "[운동] 탁자를 걷어차 사이를 막는다", en: "[Athletics] Kick the table between you" },
      stake: { ko: "성공하면 거리를 빼앗는다 · 실패하면 넘어진다", en: "Success takes his distance away · failure puts you on the floor" },
      check: { ability: "STR", skill: "athletics", dc: 11, label: "운동" },
      success: { text: { ko: `탁자가 미끄러져 스컬리를 벽으로 몬다. 찌를 거리가 사라졌다.`, en: `The table skids and pins Scully against the wall. No room left to thrust.` }, flags: ["duelEdge2"], goto: "scully2" },
      fail: { text: { ko: `탁자는 꿈쩍도 않고, 스컬리의 단검만 빨랐다.`, en: `The table doesn't budge — only Scully's dagger moves fast.` }, damage: [2, 4], ifDown: "gameover", goto: "scully2" }
    }, {
      label: { ko: "[기만] 편지 뭉치를 등불에 던지는 척한다", en: "[Deceive] Pretend to toss the letters into the lamp" },
      stake: { ko: "성공하면 스컬리가 편지로 몸을 날린다 · 실패하면 속임수가 들통난다", en: "Success makes him dive for the letters · failure exposes the bluff" },
      check: { ability: "CHA", skill: "deception", dc: 12, label: "기만" },
      success: { text: { ko: `"안 돼!" 스컬리가 편지로 몸을 날린다. 등이 훤히 비었다.\n\n그에게 편지는 목숨보다 무거운 모양이다.`, en: `"No!" Scully dives for the letters, back wide open.\n\nThose letters weigh more to him than his life, it seems.` }, flags: ["duelEdge2"], goto: "scully2" },
      fail: { text: { ko: `"그 정도로 속을 줄 알아?" 단검이 옆구리를 스친다.`, en: `"You think I'd fall for that?" The dagger grazes your side.` }, damage: [2, 4], ifDown: "gameover", goto: "scully2" }
    }, {
      classOnly: "wizard",
      label: { ko: "[비전학] 등불을 꺼 어둠을 만든다", en: "[Arcana] Snuff the lamps into darkness" },
      stake: { ko: "성공하면 그가 당신을 못 본다 · 실패하면 당신만 못 본다", en: "Success blinds him to you · failure blinds only you" },
      check: { ability: "INT", skill: "arcana", dc: 11, label: "비전학" },
      success: { text: { ko: `등불이 한꺼번에 꺼진다. 어둠 속에서 스컬리의 숨소리만 들린다 — 위치가 다 보인다.`, en: `Every lamp dies at once. In the dark, only Scully's breathing — and it tells you exactly where he is.` }, flags: ["duelEdge2"], goto: "scully2" },
      fail: { text: { ko: `불이 꺼지기 전에, 단검이 먼저 왔다.`, en: `Before the light went out, the dagger came.` }, damage: [2, 4], ifDown: "gameover", goto: "scully2" }
    }, {
      label: { ko: `[설득] "넌 심부름꾼이지. 너 대신 죽어 줄 사람은 없어."`, en: `[Persuade] "You're just the errand man. Nobody's going to die for you."` },
      stake: { ko: "성공하면 피 없이 편지를 얻는다 · 실패하면 맨몸으로 맞는다", en: "Success gets the letters without blood · failure means taking the hit" },
      check: { ability: "CHA", skill: "persuasion", dc: 13, label: "설득" },
      success: { text: { ko: `단검 끝이 떨린다. 스컬리가 편지 뭉치를 밀어 준다.\n\n"잿돌 수도원. 서명은 S. …나는 여기까지야." 사내는 뒷문으로 사라진다.`, en: `The dagger tip trembles. Scully pushes the letters across.\n\n"Ashstone Monastery. Signed S. …that's as far as I go." He slips out the back.` }, flags: ["peaceful2"], goto: "ending2" },
      fail: { text: { ko: `"말 많은 놈부터 죽는 법이지." 단검이 들어온다.`, en: `"The talkers always die first." The dagger comes in.` }, damage: [3, 4], ifDown: "gameover", goto: "scully2" }
    }, {
      "echoReq": "leadOil",
      "echo": {
        "ko": "기름 가게에서 산 램프 기름",
        "en": "the lamp oil from the shop"
      },
      "stake": {
      "ko": "판정 없이 결투의 우위를 잡는다",
      "en": "Take the upper hand in the duel without a roll"
    },
    "label": {
        "ko": "[기름] 램프 기름을 바닥에 쏟아 스컬리의 발밑을 빼앗는다",
        "en": "[Oil] Spill the lamp oil and take the floor out from under Scully"
      },
      "result": {
        "text": {
          "ko": "병이 깨지고 기름이 번진다. 달려들던 스컬리의 발이 미끄러진다 — 단검이 바닥을 긁는다.\n\n당신은 이미 그의 등 뒤에 있다.",
          "en": "The flask shatters and the oil spreads. Scully, mid-lunge, loses his footing — his dagger scrapes the floor.\n\nYou're already behind him."
        },
        "goto": "scully2",
        "flags": [
          "duelEdge2"
        ]
      }
    }
    ]

  scully2: {
    ch: 2,
    text: {
      ko: `스컬리가 벽에 등을 붙인다. 뒷문까지 세 걸음.\n\n잡으면 끝이다. 놓치면 — 편지도 함께 사라진다.`,
      en: `Scully has his back to the wall. Three steps to the back door.\n\nCatch him and it's over. Lose him — and the letters go with him.`
    },
    choices: [{
      echoReq: "duelEdge2",
      echo: { ko: "앞서 잡은 기회", en: "The opening you won" },
      label: { ko: "[운동] 잡은 틈으로 몰아붙여 제압한다", en: "[Athletics] Press the opening and pin him" },
      stake: { ko: "앞서 잡은 기회로 쉽다 · 실패하면 놓친다", en: "Easier thanks to your opening · failure lets him slip away" },
      check: { ability: "STR", skill: "athletics", dc: 9, label: "운동" },
      success: { text: { ko: `스컬리를 벽에 눌러 단검을 떨어뜨린다. "…돈을 받았을 뿐이야. 발주는 편지로만 왔어. 서명은 S, 발신지는 잿돌 수도원."`, en: `You pin Scully to the wall and the dagger clatters down. "…I just took the money. Orders only came by letter. Signed S, from Ashstone Monastery."` }, goto: "ending2" },
      fail: { text: { ko: `손끝에서 코트 자락이 빠져나간다. 뒷문이 쾅 닫힌다. 바닥에 떨어진 편지 몇 장만 남았다.`, en: `The coat-tail slips through your fingers. The back door slams. A few letters lie on the floor.` }, damage: [2, 4], ifDown: "gameover", flags: ["scullyFled"], goto: "ending2" }
    }, {
      label: { ko: "[운동] 뒷문을 먼저 막아선다", en: "[Athletics] Block the back door first" },
      stake: { ko: "이기면 스컬리를 잡는다 · 지면 다치고 놓친다", en: "Win and you have him · lose and you're hurt and he's gone" },
      check: { ability: "STR", skill: "athletics", dc: 13, label: "운동" },
      success: { text: { ko: `뒷문 앞을 막아서자 스컬리가 단검을 내린다. "…알았어. 편지로만 받았어. 서명은 S, 잿돌 수도원."`, en: `You plant yourself at the back door and Scully lowers the dagger. "…fine. Letters only. Signed S, Ashstone Monastery."` }, goto: "ending2" },
      fail: { text: { ko: `스컬리가 어깨로 밀치고 빠져나간다. 쓰러진 당신 옆에 편지 몇 장이 흩어져 있다.`, en: `Scully shoulders past you and is gone. A few letters lie scattered beside you.` }, damage: [3, 4], ifDown: "gameover", flags: ["scullyFled"], goto: "ending2" }
    }, {
      label: { ko: "편지 뭉치를 먼저 낚아챈다 — 증거를 택한다", en: "Snatch the letters first — choose the evidence" },
      stake: { ko: "증거는 확실히 · 스컬리는 놓친다", en: "The evidence for sure · Scully gets away" },
      result: { text: { ko: `편지 뭉치를 움켜쥔다. 그 사이 스컬리는 뒷문으로 사라졌다.\n\n증거는 남았고, 사람은 놓쳤다.`, en: `You grab the bundle of letters. In that moment, Scully is gone through the back door.\n\nThe evidence stays. The man doesn't.` }, flags: ["scullyFled"], goto: "ending2" }
    }, {
      label: { ko: `[위협] "S가 누군지 말해. 그럼 보내 주지."`, en: `[Intimidate] "Tell me who S is, and you walk."` },
      stake: { ko: "성공하면 단서를 듣고 끝난다 · 실패하면 다치고 놓친다", en: "Success gets you a clue and ends it · failure hurts and he's gone" },
      check: { ability: "CHA", skill: "intimidation", dc: 12, label: "위협" },
      success: { text: { ko: `스컬리가 이를 간다. "…얼굴은 몰라. 근데 톱니 줄질한 놈은 마을 사람이야. 굳은살 하나 없는, 펜 쥐는 손이었지."\n\n편지 뭉치를 던지고 뒷문으로 사라진다.`, en: `Scully grinds his teeth. "…I never saw a face. But whoever filed that gear was a villager. Soft hands — a pen-holder's hands."\n\nHe tosses the letters and is gone out the back.` }, flags: ["peaceful2", "f_hands"], goto: "ending2" },
      fail: { text: { ko: `"협박은 내 장사야." 단검이 허벅지를 긋고, 스컬리는 뒷문으로 빠진다.`, en: `"Threats are my trade." The dagger slashes your thigh and Scully is out the back.` }, damage: [2, 4], ifDown: "gameover", flags: ["scullyFled"], goto: "ending2" }
    }]
  },

  intro3: {

    text: {
      ko: `이틀을 걸어 잿돌 수도원에 닿았다. 정오 — 종이 울려야 할 시간인데, 침묵뿐이다.\n\n산 아래 주막의 노파가 말했었다. "종이 멈춘 뒤로, 그 길을 지난 여행자들이 돌아오지 않아."`,
      en: `Two days' walk brought you to the Ashstone Monastery. Noon — the hour the bell should ring. Silence.\n\nThe old woman at the inn below the mountain had said, "Since the bell stopped, travelers who take that road don't come back."`
    },
    choices: [{
      label: {
        ko: "문을 두드리기 전에, 수도원 바깥부터 살핀다",
        en: "Before you knock, look around outside the walls"
      },
      goto: "dusk3"
    }]
  },
  dusk3: {

      "en": "Before you knock, there's time until sunset to check two places outside the walls.\n\nThe pilgrims' lodge by the wall, the post station on the mountain road, the monastery's smithy."
    },
    "choices": [
      {
        "lead": "leadPilgrim",
        "label": {

          "en": "The pilgrims' lodge — ask the stranded pilgrims"

        "stake": {
          "ko": "종탑에서: 종지기에게 들이밀 말이 생긴다",
          "en": "At the bell tower: you'll have words to put to the bell-keeper"
        },
        "result": {
          "text": {

            "en": "An old pilgrim lowers his voice. \"Since the bell stopped, Odo the bell-keeper goes down below every night. Two torches going down, one coming back up.\""
          },
          "flags": [
            "leadPilgrim"
          ],
          "goto": "dusk3b"
        }
      },
      {
        "lead": "leadPost",
        "label": {
          "ko": "우편 역참 — 돌아오지 않은 배달부를 묻는다",
          "en": "The post station — ask about the courier who never came back"
        },
        "stake": {
          "ko": "지하에서: 배달부를 부를 신호를 안다",
          "en": "Below ground: you'll know a signal to call the courier"
        },
        "result": {
          "text": {
            "ko": "역참장이 장부를 짚는다. \"핍이오. 사흘 전 수도원 우편을 들고 올라가서 감감무소식이지.\"\n\n그가 짧게 휘파람을 분다. 두 번 짧게, 한 번 길게. \"배달부들끼리 쓰는 신호요. 살아 있으면 답할 거요.\"",
            "en": "The stationmaster taps the ledger. \"Pip. Took the monastery post up three days ago and never came back.\"\n\nHe whistles: two short, one long. \"Couriers' signal. If he's alive, he'll answer.\""
          },
          "flags": [
            "leadPost"
          ],
          "goto": "dusk3b"
        }
      },
      {
        "lead": "leadSmith",
        "label": {
          "ko": "부속 대장간 — 요즘 무엇을 벼렸는지 묻는다",
          "en": "The smithy — ask what's been forged lately"
        },
        "stake": {
          "ko": "물이 차오를 때: 싸우지 않고 철창을 열 수 있다",
          "en": "When the water rises: you can open the cell without a fight"
        },
        "result": {
          "text": {
            "ko": "대장장이가 이마의 땀을 닦는다. \"지하 철창 열쇠를 새로 깎아 달라더군. 꼬리표에 글씨까지 박아서.\"\n\n그가 남은 쇠꼬챙이 하나를 던져 준다. \"그 자물쇠, 이걸로도 열려. 내가 만들었으니 알지.\"",
            "en": "The smith wipes his brow. \"They had me cut new keys for the cells below. Even had writing stamped on the tag.\"\n\nHe tosses you a leftover iron pick. \"That lock opens with this too. I made it; I'd know.\""

          "flags": [
            "leadSmith"
          ],
          "goto": "dusk3b"
        }
      },

  monk2: {

    text: {
      ko: `사내가 숨을 고른다. 열쇠 고리가 허리에서 짤랑인다.\n\n그때 — 지하 깊은 곳에서 물소리가 커진다. 시간이 없다.`,
      en: `The man catches his breath. The key ring jingles at his belt.\n\nThen — from deep below, the sound of water swells. No time left.`

    choices: [{
      echoReq: "duelEdge3",
      echo: { ko: "앞서 잡은 기회", en: "The opening you won" },

      check: { ability: "STR", skill: "athletics", dc: 9, label: "운동" },
      success: { text: { ko: `사내가 촛대를 떨어뜨리고 쓰러진다. 수도복 안에는 — 부두에서 본 것과 같은 검은 코트.\n\n열쇠를 빼앗아 철창을 연다.`, en: `He drops the candlestick and falls. Under the robes — the same black coat you saw at the docks.\n\nYou take the keys and open the cell.` }, goto: "rescue" },
      fail: { text: { ko: `쓰러뜨렸지만, 넘어지며 휘두른 촛대가 정강이를 친다. 열쇠를 빼앗아 철창을 연다.`, en: `You bring him down, but his falling swing cracks your shin. You take the keys and open the cell.` }, damage: [2, 4], ifDown: "gameover", goto: "rescue" }
    }, {
      label: { ko: "[운동] 정면으로 끝낸다", en: "[Athletics] End it head-on" },
      stake: { ko: "이기면 깔끔하다 · 지면 크게 다친다", en: "Win and it's clean · lose and you're badly hurt" },
      check: { ability: "STR", skill: "athletics", dc: 13, label: "운동" },
      success: { text: { ko: `정면으로 부딪친 사내가 벽에 머리를 찧고 미끄러진다. 열쇠를 빼앗아 철창을 연다.`, en: `The man takes it head-on, cracks his head on the wall, and slides down. You take the keys and open the cell.` }, goto: "rescue" },
      fail: { text: { ko: `촛대가 갈비뼈를 친다. 숨이 막힌 채로 사내를 밀어 넘기고 열쇠를 낚아챈다.`, en: `The candlestick hits your ribs. Breathless, you shove him over and snatch the keys.` }, damage: [3, 4], ifDown: "gameover", goto: "rescue" }
    }, {
      label: { ko: "[은신] 싸움 대신 열쇠만 낚아채 철창부터 연다", en: "[Stealth] Forget the fight — lift the keys and open the cell" },
      stake: { ko: "성공하면 갇힌 이들이 함께 싸운다 · 실패하면 등을 보인 채 맞는다", en: "Success frees the prisoners to fight with you · failure means a hit in the back" },
      check: { ability: "DEX", skill: "stealth", dc: 11, label: "은신" },
      success: { text: { ko: `열쇠 고리가 소리 없이 빠져나온다. 철창이 열리자 갇혀 있던 이들이 쏟아져 나와 사내를 덮친다.`, en: `The key ring slips free without a sound. The cell opens and the prisoners pour out onto the man.` }, flags: ["quiet3"], goto: "rescue" },
      fail: { text: { ko: `열쇠를 잡는 순간 촛대가 등을 친다. 그래도 철창은 열렸다.`, en: `The instant you grab the keys, the candlestick hits your back. But the cell is open.` }, damage: [3, 4], ifDown: "gameover", goto: "rescue" }
    }, {
      label: { ko: `[위협] "S가 누구냐. 물이 차기 전에 말해."`, en: `[Intimidate] "Who is S? Talk before the water rises."` },
      stake: { ko: "성공하면 실마리를 듣는다 · 실패하면 시간과 피를 잃는다", en: "Success gets you a lead · failure costs time and blood" },
      check: { ability: "CHA", skill: "intimidation", dc: 12, label: "위협" },
      success: { text: { ko: `사내가 물소리에 질린 얼굴로 중얼거린다. "…바닷가 사람이야. 소금 냄새 나는 편지를 썼지."\n\n열쇠를 던지고 계단으로 달아난다.`, en: `Terrified by the water, the man mutters, "…someone from the coast. Their letters smelled of salt."\n\nHe throws the keys and flees up the stairs.` }, flags: ["trail"], goto: "rescue" },
      fail: { text: { ko: `"물에 빠져 죽는 건 너다!" 촛대가 팔을 친다. 열쇠는 겨우 빼앗았다.`, en: `"You're the one who'll drown!" The candlestick hits your arm. You barely wrest the keys away.` }, damage: [2, 4], ifDown: "gameover", goto: "rescue" }
    }, {
      "echoReq": "leadSmith",
      "echo": {
        "ko": "대장장이가 준 쇠꼬챙이",

    "label": {
        "ko": "[쇠꼬챙이] 싸움은 버려 두고, 대장장이의 쇠꼬챙이로 철창부터 연다",
        "en": "[Iron pick] Leave the fight — open the cell with the smith's pick"

      "result": {
        "text": {
          "ko": "물이 무릎까지 찬다. 쇠꼬챙이를 자물쇠에 밀어 넣고 비튼다 — 대장장이 말대로다. 철컥.\n\n문이 열리자 사람들이 쏟아져 나오고, 사내는 물살에 떠밀려 어둠 속으로 사라진다.",
          "en": "The water is at your knees. You jam the pick into the lock and twist — just as the smith said. Clack.\n\nThe door swings open, people pour out, and the man is swept off into the dark."

        "flags": [

        ko: `사내가 촛대를 떨어뜨리고 쓰러진다. 수도복 안에는 — 부두에서 본 것과 같은 검은 코트.\n\n열쇠를 빼앗아 철창을 연다. 여행자들이, 그리고 배달부가 비틀거리며 나온다.`,

  rescue: {
    ch: 3,
    text: {
      ko: `그때 — 지하 깊은 곳에서 굉음. 수문이 열렸다.\n\n물이 차오르며 탁자 위 편지 뭉치가 쓸려 나간다. 저게 놈들의 증거다.\n\n배달부는 다리를 절고, 물은 빠르게 차오른다. 시간은 하나를 고를 만큼만 남았다.`,
      en: `Then — a roar from deep below. A sluice gate has opened.\n\nWater rises and sweeps a bundle of letters off the table. That's their evidence.\n\nThe courier is limping, and the water climbs fast. Time enough to choose only one.`
    },
    choices: [{
      label: {
        ko: "사람을 택한다 — 배달부를 부축해 먼저 나간다",
        en: "Choose the person — help the courier out first"
      },
      stake: { ko: "증거 편지는 대부분 물에 녹는다", en: "Most of the evidence letters will dissolve" },
      frag: "f_addressee",
      result: {
        text: {
          ko: `핍을 부축해 물을 헤친다. 핍이 떨며 말한다.\n\n"그 편지들… 받는 사람이 늘 같았소. 소금여울의 세온. 촌장님 말이오."`,
          en: `You haul Pip through the water. He says, shaking,\n\n"Those letters… always the same addressee. Seon, of Saltmarsh. The chief."`
        },
        flags: ["saved3", "f_addressee"],
        goto: "ending3"
      }
    }, {
      label: {
        ko: "증거를 택한다 — 떠내려가는 편지를 쫓는다",
        en: "Choose the evidence — chase the letters being swept away"
      },
      stake: { ko: "배달부는 혼자 기어 나와야 한다", en: "The courier must crawl out on his own" },
      frag: "f_hand_match",
      result: {
        text: {
          ko: `물살을 거슬러 편지를 건진다. 젖은 서명 S — 이 글씨를 어디서 봤다.\n\n1장에서 받은 열쇠 꼬리표, 단정한 '등대'. 같은 손이다.`,
          en: `You fight the current and grab the letters. The wet signature, S — you've seen this hand before.\n\nThe tag on the key from Ch.1, the neat "Lighthouse." The same hand.`
        },
        flags: ["chase3", "f_hand_match"],
        goto: "ending3"
      }
    }, {
      "classOnly": "fighter",
      "label": {
        "ko": "둘 다 — 배달부를 둘러업고, 그대로 물살 속 편지를 쫓는다",
        "en": "Both — sling the courier over your shoulder and chase the letters into the current"
      },
      "check": {
        "ability": "STR",
        "skill": "athletics",
        "dc": 15,
        "label": "운동"
      },
      "stake": {
        "ko": "실패하면 배달부만 건지고 편지는 잃는다",
        "en": "Fail, and you save only the courier — the letters are lost"
      },
      "success": {
        "text": {
          "ko": "배달부를 어깨에 둘러업는다. 무릎까지, 허리까지 물이 찬다.\n\n떠내려가는 편지 뭉치를 한 팔로 끌어안는다. 수문이 무너지기 직전, 둘 다 안고 계단을 기어오른다.\n\n배달부가 콜록이며 말한다. \"편지… 수신인은 늘 같았소. 소금여울의, 세온.\"\n\n젖은 편지 끝의 서명. 지하 저장고 열쇠 꼬리표의 글씨와 같은 손이다.",
          "en": "You sling the courier over your shoulder. The water rises to your knees, your waist.\n\nOne arm hooks the drifting bundle of letters. Just before the sluice gives, you crawl up the stairs holding both.\n\nThe courier coughs. \"The letters… always the same addressee. Seon, of Saltmarsh.\"\n\nThe signature at the end of a soaked letter: the same hand as the writing on the undercroft key tag."
        },
        "goto": "ending3",
        "flags": [
          "saved3",
          "chase3",
          "both3",
          "f_addressee",
          "f_hand_match"
        ]
      },
      "fail": {
        "text": {
          "ko": "물이 생각보다 빨랐다. 편지에 손을 뻗는 순간, 어깨 위의 배달부가 미끄러진다.\n\n편지를 버리고 배달부를 붙든다. 계단 위로 끌어 올리자 그는 거친 숨만 몰아쉰다. 물 위로 편지 조각만 흩어진다.",
          "en": "The water is faster than you thought. As you reach for the letters, the courier slips off your shoulder.\n\nYou let the letters go and grab him. When you drag him up the stairs, he can only gasp for breath. Scraps of letters drift on the water."
        },
        "damage": [
          2,
          4
        ],
        "ifDown": "gameover",
        "goto": "ending3",
        "flags": [
          "saved3"
        ]
      }
    }
    ]
  },

  /* ---------- 사건 2 「붉은 손글씨」 1장 — 먹울의 필사소 ---------- */
  c2_intro: {
    "ch": 5,
    "text": {
      "ko": "판결이 끝나고 사흘 뒤, 봉투 하나가 문틈으로 밀려 들어왔다.\n\n안에는 종이 두 장. 하나는 소금여울 공식 기록의 사본이다. 여백에 붉은 글씨 — \"거짓말이다.\" 당신이 쓴 반박과 똑같은 말이다. 그런데 당신 글씨가 아니다.\n\n다른 한 장은 지도. 3장에서 본 그 붉은 선이, 산 너머 필사의 마을 '먹울'에서 끝난다.",
      "en": "Three days after the verdict, an envelope slides under the door.\n\nTwo sheets inside. One is a copy of a Saltmarsh Official Record. In the margin, red ink — \"This is a lie.\" The same words as your rebuttal. But it isn't your handwriting.\n\nThe other is a map. The red line you saw in Chapter 3 ends beyond the mountains, at Inkfold, the village of copyists."
    },
    "choices": [
      {
        "label": {
          "ko": "먹울로 간다",
          "en": "Go to Inkfold"
        },
        "goto": "c2_gate"
      }

  },
  c2_gate: {
    "ch": 5,
    "text": {
      "ko": "먹울은 집집마다 잉크 냄새가 나는 마을이다. 한가운데 검은 기와의 필사소 — 근방 모든 마을의 기록이 이곳에서 베껴져 보관된다.\n\n해가 지자 문이 닫힌다. 먹물 묻은 앞치마의 문지기가 등불을 들고 막아선다. \"기록 열람은 필사소장님 허락이 있어야 하오.\"",
      "en": "In Inkfold, every house smells of ink. At its heart stands the black-tiled scriptorium — every village record for miles around is copied and kept here.\n\nAt sundown the doors close. A gatekeeper in an ink-stained apron raises a lantern and blocks your way. \"Reading the records takes the copy-master's leave.\""
    },
    "choices": [
      {
        "label": {

        "check": {
          "ability": "CHA",
          "skill": "persuasion",
          "dc": 12,
          "label": "설득"

        "success": {
          "text": {

            "en": "The gatekeeper looks from your face to the copy and back. \"…That rebuttal was yours?\" He sighs and steps aside. \"People like you keep turning up lately.\""
          },
          "goto": "c2_hall"
        },
        "fail": {
          "text": {
            "ko": "\"다들 그렇게 말하지.\" 문지기가 호루라기를 분다. 골목에서 먹 묻은 경비 둘이 나온다.",
            "en": "\"They all say that.\" The gatekeeper blows a whistle. Two ink-stained guards step out of the alley."

      {

        "check": {
          "ability": "DEX",
          "skill": "stealth",

        "success": {

            "en": "An ink barrel topples and black water floods out. \"Who's there!\""

      {

          "en": "Instead of climbing the wall, face the guards alongside the gatekeeper — win them both over"

            "en": "As a drunken guard swings at the gatekeeper, you catch the arm and twist it. The gatekeeper's eyes go wide.\n\n\"…Go on in. Third row of the ledger shelves. I've been wondering what the copy-master erases every night myself.\""

        "fail": {

            "ko": "\"넌 몇 번 서가 담당이야?\" 대답이 한 박자 늦었다.",
            "en": "\"Which shelf are you on?\" Your answer comes a beat too late."

      {
        "classOnly": "wizard",
        "label": {
          "ko": "문틀에 새겨진 봉인 문자를 읽는다",

        },
        "check": {
          "ability": "INT",

        "stake": {

        "success": {
          "text": {
            "ko": "오래된 문자다. '읽지 않은 자만 들라.' 뒤집어 읽으면 — '이미 읽은 자는 지워라.'\n\n봉인이 풀린다. 이 문은 기록을 지키는 문이 아니라, 지우는 문이다.",
            "en": "An old script. 'Let only the unread enter.' Read it backward — 'Erase those who have read.'\n\nThe seal gives way. This door doesn't guard the records. It erases them."
          },
          "goto": "c2_hall",

        "fail": {

  c2_duel: {
    "ch": 5,
    "text": {
      "ko": "먹 묻은 경비 둘이 몽둥이를 든다. 뒤에서 문지기가 등불을 높인다. 셋을 다 상대할 수는 없다.",
      "en": "Two ink-stained guards raise their clubs. Behind them, the gatekeeper lifts his lantern. You can't take all three."
    },
    "choices": [
      {
        "label": {
          "ko": "[운동] 앞의 경비를 밀어 넘어뜨리고 문으로 뛴다",
          "en": "[Athletics] Shove the first guard down and run for the door"
        },
        "check": {
          "ability": "STR",
          "skill": "athletics",
          "dc": 12,
          "label": "운동"
        },
        "stake": {
          "ko": "성공하면 안으로 · 실패하면 맞고 들어간다",
          "en": "Success: you're in · Failure: you get in bruised"
        },
        "success": {
          "text": {
            "ko": "경비가 잉크 웅덩이에 미끄러진다. 당신은 이미 문 안이다.",
            "en": "The guard skids in a puddle of ink. You're already through the door."
          },
          "goto": "c2_hall"
        },
        "fail": {
          "text": {
            "ko": "몽둥이가 어깨를 친다. 이를 악물고 문틈으로 몸을 던진다.",
            "en": "A club catches your shoulder. Teeth gritted, you throw yourself through the gap in the door."
          },
          "goto": "c2_hall",
          "damage": [
            2,
            4
          ],
          "ifDown": "gameover"
        }
      },
      {
        "label": {
          "ko": "[설득] \"지우는 쪽이 당신들 편이라고 생각하나?\"",
          "en": "[Persuade] \"You think the ones doing the erasing are on your side?\""
        },
        "check": {
          "ability": "CHA",
          "skill": "persuasion",
          "dc": 13,
          "label": "설득"
        },
        "stake": {
          "ko": "성공하면 경비가 물러선다 · 실패하면 셋이 달려든다",
          "en": "Success: the guards back off · Failure: all three rush you"
        },
        "success": {
          "text": {
            "ko": "문지기의 등불이 흔들린다. \"…우리 아버지 이름도 지워졌소.\" 그가 경비들에게 손짓한다. 길이 열린다.",
            "en": "The gatekeeper's lantern wavers. \"…My father's name was erased too.\" He waves the guards back. The way opens."
          },
          "goto": "c2_hall",
          "flags": [
            "c2_tip"
          ]
        },
        "fail": {
          "text": {
            "ko": "대답 대신 몽둥이가 날아온다.",
            "en": "A club answers instead."
          },
          "goto": "c2_hall",
          "damage": [
            3,
            4
          ],
          "ifDown": "gameover"
        }
      }
    ]
  },
  c2_hall: {
    "ch": 5,
    "text": {
      "ko": "서가가 끝없이 이어진다. 손등이 닿는 곳마다 같은 제목 — '소금여울 공식 기록'.\n\n제113호. 제114호. 제115호…. 번호를 따라 걷다가 멈춘다. 이건 당신이 고쳐 쓴 번호들이다.\n\n사본마다 여백에 붉은 반박이 있다. 그런데 글씨가 다 다르다. 둥근 글씨, 날카로운 글씨, 떨리는 글씨.",
      "en": "The shelves go on and on. Everywhere your hand brushes, the same title — 'Saltmarsh Official Record.'\n\nNo. 113. No. 114. No. 115…. Following the numbers, you stop. These are the numbers you rewrote.\n\nEvery copy has a red rebuttal in the margin. But the handwriting is different each time. Round hands, sharp hands, shaking hands."
    },
    "choices": [
      {
        "label": {
          "ko": "서가 사이로 들려오는 낭독 소리를 따라간다",
          "en": "Follow the sound of someone reading aloud between the shelves"
        },
        "goto": "c2_reader"
      },
      {
        "label": {
          "ko": "[조사] 필사소장의 책상에서 오늘 밤 작업 목록을 찾는다",
          "en": "[Investigate] Look for tonight's work list on the copy-master's desk"
        },
        "check": {
          "ability": "INT",
          "skill": "investigation",
          "dc": 12,
          "label": "조사"
        },
        "stake": {
          "ko": "성공하면 무엇이 지워지는지 안다 · 실패하면 들킨다",
          "en": "Success: you learn what's being erased · Failure: you're seen"
        },
        "success": {
          "text": {
            "ko": "목록 맨 위. '소금여울 공식 기록 사본 — 붉은 반박 삭제 후 재필사. 완료: 제113호~.'\n\n그 아래 서명. 아직 마르지 않은 먹.",
            "en": "Top of the list: 'Saltmarsh Official Records, copies — re-copy with red rebuttals removed. Done: No. 113 onward.'\n\nBeneath it, a signature. The ink isn't dry yet."
          },
          "goto": "c2_reader",
          "flags": [
            "c2_erased"
          ]
        },
        "fail": {
          "text": {
            "ko": "서랍이 삐걱인다. 어둠 속 어딘가에서 붓을 내려놓는 소리.",
            "en": "The drawer creaks. Somewhere in the dark, a brush is set down."
          },
          "goto": "c2_reader",
          "flags": [
            "c2_seen"
          ]
        }
      },
      {
        "label": {
          "ko": "가장 최근 번호의 사본 — 당신이 지난번 남긴 기록 — 을 품에 넣는다",
          "en": "Pocket the copy with the latest number — the record you left last time"
        },
        "stake": {
          "ko": "내 반박을 지킨다 · 다른 반박은 두고 간다",
          "en": "You save your own rebuttal · the others stay behind"
        },
        "result": {
          "text": {
            "ko": "당신의 반박이 아직 지워지지 않은 채 남아 있다. 종이를 접어 품에 넣는다. 서가 저편에서 누군가 웃는다.",
            "en": "Your rebuttal is still there, not yet erased. You fold the sheet into your coat. From beyond the shelves, someone laughs."
          },
          "goto": "c2_reader",
          "flags": [
            "c2_ownCopy"
          ]
        }
      }
    ]
  },
  c2_reader: {
    "ch": 5,
    "text": {
      "ko": "등불 하나 없는 구석. 눈을 감은 여자가 사본을 무릎에 펴 놓고, 손끝으로 글씨를 쓸며 소리 내어 읽고 있다.\n\n\"…'이것은 거짓말이다.' 제117호, 여백.\" 그녀가 고개를 든다. 당신 쪽을 정확히 향한다.\n\n\"낭독가 이레예요. 당신 발소리는 처음이네요. 그런데 이 글씨는 알아요. 당신 거죠?\"",
      "en": "A corner with no lamp. A woman with closed eyes has a copy spread on her knees, tracing the writing with her fingertips as she reads aloud.\n\n\"…'This is a lie.' No. 117, margin.\" She raises her head — turned exactly toward you.\n\n\"I'm Ire, the reader. I don't know your footsteps. But I know this hand. It's yours, isn't it?\""
    },
    "choices": [
      {
        "label": {
          "ko": "\"붉은 손글씨는 누구 겁니까?\"",
          "en": "\"Whose is the red handwriting?\""
        },
        "result": {
          "text": {
            "ko": "이레가 웃는다. \"한 사람이 아니에요. 공식 기록을 믿지 않은 모든 사람의 손이에요. 백 명도 넘죠. 당신 것도 저 안에 있어요.\"\n\n그녀의 손끝이 멈춘다. \"그런데 누군가 매일 밤, 반박만 골라 지우고 다시 베껴요. 반박이 없는 기록만 남도록.\"",
            "en": "Ire smiles. \"Not one person. It's the hand of everyone who refused to believe the official record. More than a hundred of them. Yours is in there too.\"\n\nHer fingertips stop. \"But every night, someone picks out only the rebuttals, erases them, and copies again. So that only records without them remain.\""
          },
          "goto": "c2_end",
          "flags": [
            "c2_many"
          ]
        }
      },
      {
        "label": {
          "ko": "[지각] 그녀의 손끝을 유심히 보며, 앞을 못 보는데 어떻게 '글씨'를 아는지 묻는다",
          "en": "[Perceive] Watch her fingertips closely and ask how she knows a 'hand' without sight"
        },
        "check": {
          "ability": "WIS",
          "skill": "perception",
          "dc": 11,
          "label": "지각"
        },
        "stake": {
          "ko": "성공하면 그녀가 숨긴 것을 듣는다",
          "en": "Success: you hear what she was hiding"
        },
        "success": {
          "text": {
            "ko": "\"붉은 잉크는 마르면 종이가 살짝 오그라들어요. 손끝으로 읽히죠.\" 그녀가 잠시 망설인다.\n\n\"…그리고 지워진 자리도 읽혀요. 긁어낸 자국이요. 오늘 밤 긁힌 건, 제113호부터 전부예요. 지운 사람의 손은 — 아주 반듯해요. 반듯한 사람을 아세요?\"",
            "en": "\"Red ink puckers the paper slightly as it dries. Fingertips can read it.\" She hesitates.\n\n\"…And I can read where it's been erased. The scraping. Tonight, everything from No. 113 on was scraped. The hand that did it is — very straight. Do you know anyone straight like that?\""
          },
          "goto": "c2_end",
          "flags": [
            "c2_many",
            "c2_straight"
          ]
        },
        "fail": {
          "text": {
            "ko": "\"비밀이에요.\" 그녀가 사본을 덮는다. \"하지만 붉은 손이 한 사람이 아니라는 건 말해 줄게요.\"",
            "en": "\"That's a secret.\" She closes the copy. \"But I'll tell you this: the red hand isn't one person.\""
          },
          "goto": "c2_end",
          "flags": [
            "c2_many"
          ]
        }
      }
    ]
  },
  c2_end: {
    "ch": 5,
    "ending": 5
  },
  /* ---------- 사건 2 · 제2장 「긁힌 자리」 — 해 질 녘 필사소장이 돌아오기 전, 두 곳 ---------- */
  c2_day: {
    ch: 6,
    text: {
      ko: `이튿날 아침, 필사소 마당. 이레가 빨래를 너는 척하며 속삭인다.\n\n"필사소장 묵은 해 질 녘에 돌아와요. 그 전에 볼 수 있는 곳은 두 군데뿐이에요."\n\n잉크 가게, 필사소 장부실, 필사공 숙소. 그리고 — 이레가 말하지 않은 곳 — 그녀의 방.`,
      en: `The next morning, in the scriptorium yard. Ire pretends to hang laundry and whispers.\n\n"Muk, the copy-master, comes back at sundown. Before then, there's time for two places."\n\nThe ink shop, the scriptorium ledger room, the copyists' lodging. And — a place Ire doesn't mention — her own room.`
    },
    choices: [{
      lead: "c2_leadInk",
      label: { ko: "잉크 가게 — 붉은 잉크를 누가 사 가는지 묻는다", en: "The ink shop — ask who buys the red ink" },
      stake: { ko: "필사소장 앞에서: 주문서 한 장을 내밀 수 있다", en: "Before the copy-master: you'll have an order slip to show" },
      result: {
        text: {
          ko: `주인이 손가락을 꼽는다. "붉은 잉크는 낭독가 아가씨만 사 가요. 매일 아침 한 병씩."\n\n"그리고 필사소에서는 — 이거." 계산대 밑에서 꺼낸 주문서. '잉크 지우개 가루, 열 통. 필사소장 묵.'\n\n누군가는 붉게 쓰고, 누군가는 그걸 매일 밤 갈아 없앤다.`,
          en: `The owner counts on his fingers. "Only the reader girl buys red ink. One bottle every morning."\n\n"And the scriptorium orders — this." An order slip from under the counter: 'Ink-eraser powder, ten tins. Copy-master Muk.'\n\nSomeone writes in red, and someone grinds it away every night.`
        },
        flags: ["c2_leadInk", "c2f_powder"],
        goto: "c2_day2"
      }
    }, {
      lead: "c2_leadLedger",
      label: { ko: "필사소 장부실 — 필사료가 어디서 들어오는지 본다", en: "The ledger room — see where the copying fees come from" },
      stake: { ko: "필사소장 앞에서: 돈의 흐름을 짚을 수 있다", en: "Before the copy-master: you can point to the money" },
      result: {
        text: {
          ko: `먼지 쌓인 수입 장부. 대부분 몇 푼짜리 필사료다. 한 줄만 다르다.\n\n'소금여울 촌장실 — 정서비(淨書費). 매달. 금화 열.'\n\n깨끗하게 베껴 주는 값. 붉은 반박 없이.`,
          en: `A dusty income ledger. Mostly copying fees of a few coppers. One line is different.\n\n'Saltmarsh chief's office — clean-copy fee. Monthly. Ten gold.'\n\nThe price of a clean copy. Without the red rebuttals.`
        },
        flags: ["c2_leadLedger", "c2f_pay"],
        goto: "c2_day2"
      }
    }, {
      lead: "c2_leadDorm",
      label: { ko: "필사공 숙소 — 밤일을 하는 견습생을 찾는다", en: "The copyists' lodging — find the apprentice who works nights" },
      stake: { ko: "필사소장 앞에서: 증인이 한 명 생긴다", en: "Before the copy-master: you'll have a witness" },
      result: {
        text: {
          ko: `구석 침상의 소년, 솔. 손톱 밑이 붉다. 붉은 잉크가 아니라 — 긁어낸 붉은 가루.\n\n"밤마다 시켜서 해요. 붉은 글씨만 긁어요. 안 하면 쫓겨나요." 소년이 긁개를 내민다. "이거 보세요. 다 빨개요."`,
          en: `A boy on the corner cot, Sol. Red under his fingernails. Not red ink — scraped red dust.\n\n"I'm told to, every night. Just the red writing. If I don't, I'm out." He holds out a scraper. "Look. It's all red."`
        },
        flags: ["c2_leadDorm", "c2f_scraper"],
        goto: "c2_day2"
      }
    }, {
      lead: "c2_leadIre",
      label: { ko: "이레의 방 — 그녀가 마당에 있는 사이 들여다본다", en: "Ire's room — look in while she's in the yard" },
      stake: { ko: "3장에서: 붉은 손의 비밀을 먼저 안다", en: "In Chapter 3: you'll know the red hand's secret first" },
      result: {
        text: {
          ko: `방 안은 붉다. 빈 잉크병이 벽을 따라 쌓여 있고, 책상 위에는 사본 수십 장 — 여백마다 붉은 반박.\n\n긁힌 자리 위에, 같은 말이 다시 쓰여 있다. 글씨는 제각각인데, 잉크는 전부 같은 병이다.`,
          en: `The room is red. Empty ink bottles line the walls, and on the desk lie dozens of copies — a red rebuttal in every margin.\n\nOver the scraped places, the same words are written again. The hands differ, but the ink all comes from the same bottle.`
        },
        flags: ["c2_leadIre", "c2f_ire"],
        goto: "c2_day2"
      }
    }]
  },

          en: `The apprentice Sol has red under his fingernails. "Every night I scrape off just the red writing. I'm told to."`

      result: {
        text: {
          ko: `붉은 잉크병이 벽을 따라 쌓여 있다. 긁힌 자리 위에 같은 반박이 다시 쓰여 있다.`,
          en: `Red ink bottles line the walls. Over the scraped places, the same rebuttals are written again.`

      label: { ko: "[옥중] 감옥의 세온에게 먼저 들른다", en: "[Prison] Visit Seon in his cell first" },
      result: {
        text: { ko: `세온이 철창 너머로 웃는다. "정서비? 내가 시작한 게 아닐세. 내가 촌장이 되기 훨씬 전부터 기록관 자리에 딸려 있던 돈이야."\n\n"확인란을 보게, {이름}. 자네 앞사람들이 거기 뭐라고 썼는지."`, en: `Seon smiles through the bars. "The clean-copy fee? I didn't start it. That money came with the recorder's post long before I was chief."\n\n"Look at the confirmation line, {name}. See what the ones before you wrote there."` },
        flags: ["fin_tip"], goto: "fin_archive"
      }
    }, {
      echoReq: "dealSeon",
      echo: { ko: "세온과 맺은 거래", en: "Your deal with Seon" },
      label: { ko: "[세온의 사람] 세온에게 서고 열쇠를 청한다", en: "[Seon's Man] Ask Seon for the archive key" },
      result: {
        text: { ko: `세온이 열쇠를 탁자 위로 미끄러뜨린다. "보고 나면 알 걸세. 시험관이 왜 필요한지."\n\n"자네 앞에 백열두 명이 있었어. 다들 같은 칸에 서명했지."`, en: `Seon slides the key across the table. "Once you've seen it, you'll understand why a tester is needed."\n\n"There were a hundred and twelve before you. Every one of them signed the same line."` },
        flags: ["fin_tip"], goto: "fin_archive"
      }
    }, {
      echoReq: "accuseBern",
      echo: { ko: "당신이 가둔 베른", en: "Bern, whom you put away" },
      label: { ko: "[베른] 옥에 갇힌 베른을 찾아간다", en: "[Bern] Visit Bern in his cell" },
      result: {
        text: { ko: `베른이 철창 너머로 오래 당신을 본다. "날 넣은 그 기록 말인가. 확인란에 자네 이름이 적혔겠지."\n\n"서고에 가 보게. 앞사람들 이름도 다 거기 있네."`, en: `Bern studies you through the bars for a long time. "The record that put me here? Your name went on its confirmation line, I expect."\n\n"Go to the archive. The ones before you are all in there."` },
        flags: ["fin_tip"], goto: "fin_archive"
      }
    }, {
      label: { ko: "곧장 촌장실 서고로 간다", en: "Go straight to the chief's office archive" },
      goto: "fin_archive"
    }]
  },
  fin_archive: {
    ch: 8,
    text: {
      ko: `촌장실 서고. 맨 안쪽 서가에 '기록관' 이름표가 붙어 있다. 제1호부터 제112호까지 — 당신보다 먼저 이 자리를 맡았던 기록관들의 기록이다.\n\n전부 깨끗하다. 여백 하나 없이. 마지막 장마다 같은 문장이 있고, 같은 자리에 이름만 다르다. '이 기록에 반박 없음을 확인함 — 기록관 ○○.'\n\n제112호의 마지막 장만 다르다. 확인란이 비어 있고, 그 아래 붉은 글씨 한 줄. '다음 기록관 — {이름}.'`,
      en: `The chief's office archive. The innermost shelf is labelled 'Recorder.' Nos. 1 through 112 — the records of everyone who held this post before you.\n\nAll of them are clean. Not a mark in any margin. Each ends with the same sentence, the same line, only the name changing: 'I confirm this record has no rebuttal — Recorder ____.'\n\nOnly the last page of No. 112 is different. The confirmation line is blank, and beneath it, one line in red: 'Next recorder — {name}.'`
    },
    choices: [{
      label: { ko: "[조사] 정서비 지출부를 찾는다", en: "[Investigation] Find the ledger for the clean-copy fee" },
      check: { ability: "INT", skill: "investigation", dc: 12, label: "조사" },
      stake: { ko: "찾으면 판결의 증거가 된다 · 못 찾으면 회의가 먼저 시작된다", en: "Find it and it's proof for the verdict · miss it and the council starts first" },
      success: {
        text: { ko: `지출부 맨 앞장. '정서비 — 매달 금화 열. 결재: 촌장. 연서: 마을 회의.'\n\n그 아래 일곱 개의 서명 — 선술집 '닻과 못' 주인, 선주 조합장, 대장장이…. 지우라고 돈을 낸 손은 하나가 아니었다.`, en: `The ledger's first page. 'Clean-copy fee — ten gold a month. Approved: the chief. Co-signed: the village council.'\n\nBelow it, seven signatures — the keeper of the Anchor & Nail, the head of the boatowners, the smith…. The hand that paid for the erasing was not one hand.` },
        flags: ["fin_council"], goto: "fin_council"
      },
      fail: {
        text: { ko: `서류 더미가 무너진다. 복도에서 발소리 — 회의실에 불이 켜진다. 늦었다.`, en: `A stack of papers collapses. Footsteps in the corridor — lamps come on in the council room. Too late.` },
        goto: "fin_council"
      }
    }, {
      echoReq: "c2_memorized",
      echo: { ko: "먹울에서 외운 지워진 번호들", en: "The erased numbers you memorized in Inkfold" },
      label: { ko: "[기억] 지워진 번호를 떠올리며 서가를 훑는다", en: "[Memory] Walk the shelf with the erased numbers in mind" },
      result: {
        text: { ko: `제113호부터 — 당신의 번호들만 서가에 없다. 먹울로 가기 전, 여기서 먼저 빠졌다.\n\n빈칸에 출고 표가 꽂혀 있다. '정서 의뢰 — 결재: 촌장. 연서: 마을 회의 일곱.' 지출부가 그 뒤에 묶여 있다.`, en: `From No. 113 on — only your numbers are missing from the shelf. They left here before they ever reached Inkfold.\n\nA dispatch slip sits in the gap: 'Sent for clean copy — approved: the chief. Co-signed: the council of seven.' The ledger is bound behind it.` },
        flags: ["fin_council", "fin_gap"], goto: "fin_council"
      }
    }, {
      echoReq: "f_hand_match",
      echo: { ko: "열쇠 꼬리표의 글씨", en: "The hand on the key tag" },
      label: { ko: "[필체] 제112호의 붉은 한 줄을 열쇠 꼬리표 글씨와 대 본다", en: "[Handwriting] Hold No. 112's red line against the key-tag hand" },
      result: {
        text: { ko: `다르다. 세온의 반듯한 글씨가 아니다. 둥글고 떨리는 글씨 — 먹울 서가에서 본 수많은 붉은 손 가운데 하나다.\n\n제112호의 기록관이 확인란에 서명하는 대신 남긴, 마지막 반박이다. 당신 이름을 처음 적은 건 시험관이 아니라 앞사람이었다.`, en: `It doesn't match. Not Seon's straight hand. A round, shaky hand — one of the many red hands from the Inkfold shelves.\n\nThe last rebuttal of Recorder No. 112, written instead of a signature. The first to write your name was not the tester. It was the one before you.` },
        flags: ["fin_prev"], goto: "fin_council"
      }
    }, {
      label: { ko: "제112호의 빈 확인란을 오래 들여다본다", en: "Stare at No. 112's blank confirmation line" },
      result: {
        text: { ko: `빈칸 아래, 손톱으로 누른 자국이 있다. 쓰다 만 서명. 그리고 그 위에 덧쓴 붉은 한 줄.\n\n앞사람은 마지막에, 서명하지 않기로 했다.`, en: `Under the blank line there's a dent pressed by a fingernail — a signature begun and abandoned. Above it, the red line written over.\n\nAt the very end, the one before you chose not to sign.` },
        flags: ["fin_prev"], goto: "fin_council"
      }
    }]
  },
  fin_council: {
    ch: 8,
    text: {
      ko: `새벽, 촌장실 회의실. 마을 회의 일곱 사람이 모여 있다. 선술집 '닻과 못' 주인이 헛기침을 한다.\n\n"기록관, 오늘 감찰관이 오면 올해 마지막 공식 기록에 서명을 해 주게. 앞의 백열두 명이 다 그랬듯이. 깨끗한 기록이 있어야 도청이 세금을 올리지 않고, 마을이 조용하네."\n\n탁자 위에 마지막 공식 기록이 펼쳐져 있다. 확인란이 비어 있다.`,
      en: `Dawn, the council room of the chief's office. The seven of the village council are gathered. The keeper of the Anchor & Nail clears his throat.\n\n"Recorder, when the inspector comes today, sign the last official record of the year. Just as the hundred and twelve before you did. A clean record keeps the province from raising our taxes. It keeps the village quiet."\n\nThe year's last official record lies open on the table. The confirmation line is blank.`
    },
    choices: [{
      echoReq: "c2f_pay",
      echo: { ko: "먹울의 정서비 장부", en: "The clean-copy ledger from Inkfold" },
      label: { ko: `[장부] "깨끗함을 돈으로 산 기록이 깨끗합니까?" 먹울의 정서비 장부를 내민다`, en: `[Ledger] "Is a record whose cleanness was bought actually clean?" Lay down the Inkfold ledger` },
      result: {
        text: { ko: `일곱 사람이 장부를 돌려 본다. 대장장이가 먼저 눈을 피한다. 선주 조합장이 중얼거린다. "…매달 금화 열이 거기로 갔군."\n\n회의가 둘로 갈린다.`, en: `The seven pass the ledger around. The smith is the first to look away. The head of the boatowners mutters, "…so that's where ten gold went every month."\n\nThe council splits in two.` },
        flags: ["fin_split"], goto: "fin_sign"
      }
    }, {
      echoReq: "caughtRen",
      echo: { ko: "난간에서 붙잡아 준 렌", en: "Ren, whom you caught at the railing" },
      label: { ko: "[인연] 문가에 선 렌을 돌아본다", en: "[Bond] Turn to Ren, standing in the doorway" },
      result: {
        text: { ko: `렌이 갈고리 없는 손을 들어 보인다. "공식 기록에 내 이름은 늘 '도굴꾼'이었지. 이 사람은 날 '붙잡았다'고 썼어."\n\n"난 그 기록이 더 맞다고 봐."`, en: `Ren raises a hand with no hook in it. "In the official record I was always 'grave-robber.' This one wrote that I was 'caught.'"\n\n"I say that record's the truer one."` },
        flags: ["fin_split", "fin_ren"], goto: "fin_sign"
      }
    }, {
      label: { ko: `[설득] "반박이 지워지면, 다음 기록관도 같은 칸에 서명하게 됩니다."`, en: `[Persuade] "If the rebuttals are erased, the next recorder signs the same line too."` },
      check: { ability: "CHA", skill: "persuasion", dc: 13, label: "설득" },
      success: {
        text: { ko: `선술집 주인이 입을 다문다. 제112호의 빈 확인란을 떠올린 얼굴이다. "…그 사람도 마지막엔 서명을 안 했지."\n\n회의가 둘로 갈린다.`, en: `The tavern keeper falls silent — thinking of No. 112's blank line. "…That one didn't sign at the end either."\n\nThe council splits in two.` },
        flags: ["fin_split"], goto: "fin_sign"
      },
      fail: {
        text: { ko: `"기록관은 기록만 하면 되네." 일곱 사람이 한꺼번에 고개를 끄덕인다.`, en: `"A recorder only has to record." All seven nod at once.` },
        goto: "fin_sign"
      }
    }, {
      label: { ko: "아무 말 없이 펜을 받아 든다", en: "Take the pen without a word" },
      goto: "fin_sign"
    }]
  },
  fin_sign: {
    ch: 8,
    text: {
      ko: `아침. 감찰관의 마차가 촌장실 앞에 선다. 회의실 문이 열린다.\n\n펜이 당신 손에 있다. 확인란 — '이 기록에 반박 없음을 확인함 — 기록관 ____.'\n\n제113호. 당신의 첫 번호였다.`,
      en: `Morning. The inspector's carriage stops outside the chief's office. The council-room door opens.\n\nThe pen is in your hand. The line reads: 'I confirm this record has no rebuttal — Recorder ____.'\n\nNo. 113. That was your first number.`
    },
    choices: [{
      label: { ko: "[붉은 여백] 확인란 대신 여백에 붉게 쓴다 — '반박 있음.' 그리고 지출부를 내민다", en: "[Red Margin] Instead of the line, write in red in the margin — 'Rebuttal stands.' Then hand over the ledger" },
      needFrags: ["fin_council"],
      stake: { ko: "정서비가 기록에 남는다 · 마을 회의 일곱 이름도 함께", en: "The clean-copy fee goes on the record · and so do the council's seven names" },
      result: {
        text: { ko: `감찰관 앞에 지출부를 펼친다. 결재 하나, 연서 일곱, 그리고 백열두 개의 확인란.\n\n"정서비는 한 사람이 받은 돈이 아니었군." 감찰관이 마지막 장 여백의 붉은 글씨를 오래 본다. "이것도 기록이오?"\n\n"이것이 기록입니다."`, en: `You open the ledger before the inspector. One approval, seven co-signatures, and a hundred and twelve confirmation lines.\n\n"So the fee was never one man's money." The inspector studies the red writing in the last page's margin for a long time. "Is this part of the record too?"\n\n"This is the record."` },
        flags: ["fin_red"], goto: "fin_end"
      }
    }, {
      echoReq: "c2_many",
      flagNot: "c2_dealMuk",
      echo: { ko: "곁에 남은 이레", en: "Ire, still beside you" },
      label: { ko: "[낭독] 펜을 이레에게 넘긴다 — 광장에서 소리 내어 읽게 한다", en: "[Reading] Hand the pen to Ire — let her read it aloud in the square" },
      stake: { ko: "모두가 듣는다 · 누구의 이름도 지켜지지 않는다", en: "Everyone hears it · no one's name is spared" },
      result: {
        text: { ko: `이레가 광장 우물가에 선다. 제1호부터 — 지워졌던 반박을 손끝으로 읽어 나간다.\n\n백열두 명의 기록관 가운데 몇은 확인란 아래에 아주 작게, 붉게 써 두었었다. 이레는 그것까지 읽는다. 사람들이 하나둘 멈춰 선다. 감찰관도.`, en: `Ire stands by the well in the square. From No. 1 on, she reads the erased rebuttals with her fingertips.\n\nSome of the hundred and twelve recorders had written beneath the confirmation line — very small, in red. Ire reads those too. One by one, people stop to listen. So does the inspector.` },
        flags: ["fin_read"], goto: "fin_end"
      }
    }, {
      label: { ko: "[서명] 확인란에 이름을 쓴다 — 앞의 백열두 명처럼", en: "[Sign] Write your name on the line — like the hundred and twelve before you" },
      stake: { ko: "마을은 조용하다 · 붉은 손은 다시 지워진다", en: "The village stays quiet · the red hands are erased again" },
      result: {
        text: { ko: `펜촉이 종이에 닿는다. 반듯하게. 감찰관이 고개를 끄덕인다. "이상 없군."\n\n회의실을 나서는 일곱 사람의 어깨가 가볍다.`, en: `The nib touches the paper. Neatly. The inspector nods. "Nothing out of order."\n\nThe seven leave the council room with lighter shoulders.` },
        flags: ["fin_clean"], goto: "fin_end"
      }
    }]
  },
  fin_end: {
    ch: 8,
    ending: 8
  },
  /* ---------- 에필로그 「S」 — 사건 기록장이 결론을 허락할 때만 온다 ---------- */
  accuse: {
    ch: 4,
    text: {
      ko: `소금여울로 돌아왔다. 등대는 돌고, 부두는 조용하다.\n\n촌장 집 서재. 세온이 차를 따르며 웃는다. "돌아왔군, {이름}. 시험은 통과일세."\n\n창가에는 베른 노인이 고개를 숙이고 서 있다. 사건 기록장의 조각들이 가리키는 이름을, 세온도 이미 아는 얼굴이다.\n\n"고발하게. 그러면 이번 겨울, 밀수선이 싣고 오던 곡식과 약도 끊기겠지. 마을 아이들이 무얼 먹을지는 자네가 정하는 걸세."\n\n베른이 낮게 말한다. "날 고발하게. 난 늙었고, 거짓말도 했지. 마을은 살아야 하네."`,
      en: `You're back in Saltmarsh. The lighthouse turns; the docks are quiet.\n\nThe chief's study. Seon pours tea and smiles. "You're back, {name}. You passed the test."\n\nBern stands at the window, head bowed. The name your case board points to — Seon's face says he already knows it.\n\n"Accuse me, then. And this winter, the grain and medicine the smugglers brought in stop too. What the village children eat is your call now."\n\nBern speaks low. "Accuse me. I'm old, and I lied. The village has to live."`
    },
    choices: [{
      wrongNot: true,
      caseReady: true,
      label: { ko: "[고발] 세온이 S다 — 관헌에 넘긴다", en: "[Accuse] Seon is S — hand him to the law" },
      stake: { ko: "진실이 밝혀진다 · 이번 겨울의 곡식과 약이 끊긴다", en: "The truth comes out · this winter's grain and medicine stop" },
      result: {
        text: {
          ko: `관헌의 마차가 언덕을 오른다. 세온은 끝까지 웃는다. "자네가 옳네. 옳은 건 늘 비싸지."`,
          en: `The constables' cart climbs the hill. Seon smiles to the end. "You're right. Right is always expensive."`
        },
        flags: ["accuseSeon"],
        goto: "ending4"
      }
    }, {
      label: { ko: "[희생] 스스로 나선 베른에게 죄를 씌운다", en: "[Sacrifice] Let Bern, who offered himself, take the blame" },
      stake: { ko: "마을은 지금처럼 버틴다 · 죄 없는 노인이 끌려간다", en: "The village holds on as it is · an innocent old man is taken away" },
      result: {
        text: {
          ko: `베른이 스스로 손을 내민다. 세온은 고개를 숙이지만, 눈은 웃고 있다.`,
          en: `Bern holds out his own wrists. Seon bows his head, but his eyes are smiling.`
        },
        flags: ["accuseBern"],
        goto: "ending4"
      }
    }, {
      label: { ko: "[거래] 알고도 덮는다 — 세온의 사람이 된다", en: "[Deal] Bury what you know — become Seon's man" },
      stake: { ko: "마을도 진실도 지금 그대로 · 다음 '시험'은 당신이 낸다", en: "Village and truth stay as they are · the next 'test' is yours to set" },
      result: {
        text: {
          ko: `세온이 두 번째 찻잔을 민다. "잘 생각했네. 다음 시험관이 필요했거든."`,
          en: `Seon slides a second cup across. "Wise. I needed the next examiner."`
        },
        flags: ["dealSeon"],
        goto: "ending4"
      }
    }, {
      wrongReq: true,

function banterFor(scene, flags, no) {
  const pool = (BANTER[scene] || []).filter(b => (!b.req || flags.includes(b.req)) && (!b.not || !flags.includes(b.not)));
  if (!pool.length) return null;
  let h = Number(no) || RECORD_FIRST;
  for (const c of scene) h = (h * 31 + c.charCodeAt(0)) % 9973;
  return pool[h % pool.length];

const css = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=IBM+Plex+Mono:wght@400;600&family=Black+Han+Sans&family=Oswald:wght@500;700&display=swap');
.crpg * { box-sizing:border-box; margin:0; }
.crpg {
  --ink:#121110; --panel:#1b1917; --panel2:#23201d; --line:#3d3731;
  --text:#e6dfd1; --dim:#8e867a; --gold:#cdb68b; --red:#c0392b;
  --good:#7fbf7f; --bad:#d96a5f; --accent:#b3aa9c; --redText:#e0604f;
  min-height:100vh; background:var(--ink); color:var(--text);
  font-family:'Noto Serif KR',serif; display:flex; flex-direction:column; align-items:center; padding:0 16px 48px;
}
.crpg .frame { width:100%; max-width:760px; }
.crpg header { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:18px 4px 12px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.crpg h1 { font-weight:900; font-size:21px; letter-spacing:.2em; color:var(--gold); }
.crpg h1 span { color:var(--dim); font-weight:400; font-size:12px; letter-spacing:.08em; margin-left:10px; }
.crpg .hctrl { display:flex; gap:8px; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim); }
.crpg .hctrl select, .crpg .hctrl button { background:var(--panel); color:var(--gold); border:1px solid var(--line);
  border-radius:4px; padding:4px 9px; font-family:inherit; font-size:12px; cursor:pointer; }
.crpg .lhscene { display:block; width:100%; border:1px solid var(--line); border-radius:10px; margin-bottom:16px; background:#0f0e0d; }
.crpg .artimg { display:block; width:100%; border:1px solid var(--gold); border-radius:10px; margin-bottom:4px; }
.crpg .artcredit { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim); text-align:right; margin-bottom:12px; }
.crpg .sheet { display:flex; gap:14px; flex-wrap:wrap; align-items:center; background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:13px; }
.crpg .sheet .nm { font-weight:600; color:var(--gold); }
.crpg .sheet .cls { font-style:normal; font-size:12px; color:var(--dim); margin-left:4px; }
.crpg .health { flex:1 1 160px; min-width:110px; }
.crpg .healthLabel { display:flex; justify-content:space-between; gap:12px; margin-bottom:5px; font-size:12px; }
.crpg .hpbar { height:8px; background:#0d0c0b; border-radius:4px; overflow:hidden; }
.crpg .hpbar i { display:block; height:100%; background:linear-gradient(90deg,#a33,#d96a5f); transition:width .4s; }
.crpg .statsHelp { width:100%; margin:8px 0; color:var(--dim); font-size:12px; line-height:1.65; }
.crpg .statsHelp summary { color:var(--gold); cursor:pointer; }
.crpg .statsHelp p { margin:6px 0; }
.crpg .recordScope { margin:16px 0 8px; color:var(--dim); font-size:12px; line-height:1.6; }
.crpg .recordScope strong { color:var(--text); }
.crpg .recordScope p { margin:4px 0; }
.crpg .actionHelp { display:block; margin-top:6px; color:var(--dim); font-size:12px; line-height:1.5; }
