/* 플레이테스트 빌드 태그 — 테스트 중 버전 구분용. 수정할 때마다 뒤 번호를 올린다. */
const BUILD = "v0.7.3-pt13";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxFx_m5rhCZmqGoy3JcUUNqEgiObMWNHe9hx-LnZrhzIkfwa9-yJGBWP0lVulptnNQeCQ/exec";
function gasPost(payload, options = {}) {
  return fetch(GAS_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload),
    keepalive: !!options.keepalive
  }).then(r => r.text()).then(t => String(t).indexOf("ok") >= 0);
}
function tele(event, scene, who, extra, keepalive = false) {
  try {
    gasPost({
      type: "telemetry",
      scene: scene || "",
      who: who || "",
      text: event,
      extra: extra || ""
    }, {keepalive}).catch(() => {});
  } catch (e) {}
}

// Small, framework-independent clock: it measures visible, actionable time,
// including reading time. It does not claim to measure thought or attention.
function createDecisionClock(now = () => typeof performance !== "undefined" ? performance.now() : Date.now()) {
  let key = null, elapsed = 0, since = null, measured = false;
  function pause() {
    if (since !== null) elapsed += Math.max(0, now() - since);
    since = null;
  }
  return {
    sync(nextKey, paused) {
      if (nextKey !== key) { pause(); key = nextKey; elapsed = 0; measured = !!key; }
      if (!key || paused) pause();
      else if (since === null) since = now();
    },
    read(expectedKey) {
      if (!measured || key !== expectedKey) return null;
      return Math.round(elapsed + (since === null ? 0 : Math.max(0, now() - since)));
    },
    pause

}
function telemetryId(prefix) {
  const random = typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"
    ? crypto.randomUUID().replace(/-/g, "").slice(0, 12)
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return prefix + random;
}
function telemetryPlayer() {
  let id = store.get("aduventure_anon_player");
  if (typeof id !== "string" || !/^p[a-z0-9]{8,20}$/i.test(id)) {
    id = telemetryId("p");
    store.set("aduventure_anon_player", id);
  }
  return id;
}
function newTelemetryRun(previous) {
  return {id: telemetryId("r"), seq: 0, player: telemetryPlayer(), previous: previous || undefined};
}
function restoreTelemetryRun(saved) {
  if (!saved || typeof saved.id !== "string" || !/^r[a-z0-9]{8,20}$/i.test(saved.id)) return newTelemetryRun();

}
function encodeTelemetry(data) {
  const text = JSON.stringify(data);
  // Do not send invalid/truncated JSON through the legacy six-column GAS sink.
  return text.length <= 950 ? text : null;
}
function emitTelemetry(event, run, data, keepalive = false) {
  try {
    if (!run) return;
    const extra = encodeTelemetry({v: 1, build: BUILD, run_id: run.id, player_id: run.player, ...data});
    if (extra) tele(event, data.scene_id, run.player, extra, keepalive);
  } catch (e) { /* Analytics must never stop a game. */ }
}
function reportClientError(msg, extra) {
  try {
    gasPost({
      type: "error",
      build: BUILD,
      text: String(msg || "unknown"),
      extra: extra || "",
      at: new Date().toISOString()
    }).catch(() => {});
  } catch (e) {}
}
if (typeof window !== "undefined") {
  window.addEventListener("error", function (e) {

  });
  window.addEventListener("unhandledrejection", function (e) {
    reportClientError(String(e.reason), "unhandledrejection");
  });
}

   저장소 (GitHub Pages 등 일반 브라우저에서 동작,

   ============================================================ */
const memStore = {};
const store = {
  get(k) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : memStore[k] ?? null;
    } catch (e) {
      return memStore[k] ?? null;
    }
  },
  set(k, v) {
    memStore[k] = v;
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
  },
  remove(k) {
    delete memStore[k];
    try {
      localStorage.removeItem(k);
    } catch (e) {}
  }
};

let _ac = null;
function _ctx() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === "suspended") _ac.resume();
  return _ac;
}
const SFX = {
  enabled: false,
  toggle() {
    this.enabled = !this.enabled;
    try {
      this.enabled ? BGM.start() : BGM.stop();
    } catch (e) {}
    return this.enabled;
  },
  _tone(freq, t0, dur, vol, type) {
    const c = _ctx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(c.currentTime + t0);
    o.stop(c.currentTime + t0 + dur + 0.05);
  },
  dice() {
    if (!this.enabled) return;
    try {
      for (let i = 0; i < 5; i++) this._tone(160 + Math.random() * 240, i * 0.07, 0.05, 0.05, "square");
    } catch (e) {}
  },
  good() {
    if (!this.enabled) return;
    try {
      this._tone(523, 0, 0.18, 0.07);
      this._tone(784, 0.12, 0.3, 0.07);
    } catch (e) {}
  },
  bad() {
    if (!this.enabled) return;
    try {
      this._tone(140, 0, 0.35, 0.09, "triangle");
      this._tone(90, 0.1, 0.4, 0.08, "triangle");
    } catch (e) {}
  },
  bell() {
    if (!this.enabled) return;
    try {
      [0, 1.4, 2.8].forEach(t => {
        this._tone(660, t, 1.3, 0.08);
        this._tone(1320, t, 0.9, 0.03);
        this._tone(440, t, 1.6, 0.05);
      });
    } catch (e) {}
  }
};
/* ---------- 배경음(BGM) — 음원 파일 없이 WebAudio로 만든다. 게임 상태에 따라 실시간으로 변한다 ----------
   bgmMood는 순수 함수(테스트 대상), BGM은 그 결과를 소리로 옮기는 층이다. 소리 토글(🔇/🔊)을 따른다. */
const BGM_THEMES = {
  1: { notes: [55, 82.41], wave: "triangle", noise: 700, noiseGain: 0.05 }, // 폭풍 속 등대 — 빗소리 + 낮은 A
  2: { notes: [73.42, 110], wave: "triangle", noise: 420, noiseGain: 0.035 }, // 안개 부두 — 파도 + D
  3: { notes: [65.41, 98, 130.81], wave: "sine", noise: 260, noiseGain: 0.015 } // 빈 수도원 — 오르간 같은 C 화음
};
// 숨을 멈추는 장면: 고르기 전에 소리를 비워 선택의 무게를 키운다.
const BGM_HUSH = ["railing", "rescue", "signal"];
function bgmMood({ sceneKey, chapter, hp, maxHp, combat, enemyIntent, enemyDone, playerDown, ending, gameover }) {
  const theme = BGM_THEMES[chapter] ? chapter : 1;
  if (gameover) return { theme, drone: 0, rain: 0.4, tension: 0, pulse: 0 };
  const hush = BGM_HUSH.includes(sceneKey);
  const fighting = !!combat && !enemyDone && !playerDown;
  const ratio = maxHp ? hp / maxHp : 1;
  return {
    theme,
    drone: hush ? 0 : ending ? 0.6 : 1,
    rain: hush ? 0.35 : 1,
    // 렌의 '강타' 예고에는 저음이 끝까지 차오른다. 그 외 전투는 절반.
    tension: fighting ? (enemyIntent === "hook" ? 1 : 0.45) : 0,
    // 체력이 줄면 심장박동이 빨라진다(분당 박동 수, 0이면 없음).
    pulse: hp > 0 && ratio <= 1 / 3 ? 104 : fighting && ratio <= 1 / 2 ? 76 : 0
  };
}
const BGM = {
  _nodes: null,
  _theme: null,
  _beat: null,
  _bpm: 0,
  start() {
    if (this._nodes) return;
    const c = _ctx();
    const master = c.createGain();
    master.gain.value = 0.9;
    master.connect(c.destination);
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    const noiseFilter = c.createBiquadFilter();
    noiseFilter.type = "lowpass";
    const noiseGain = c.createGain();
    noiseGain.gain.value = 0;
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(master);
    noise.start();
    const droneGain = c.createGain();
    droneGain.gain.value = 0;
    const droneFilter = c.createBiquadFilter();
    droneFilter.type = "lowpass";
    droneFilter.frequency.value = 420;
    droneFilter.connect(droneGain);
    droneGain.connect(master);
    const tension = c.createOscillator();
    tension.type = "sine";
    tension.frequency.value = 41;
    const tensionGain = c.createGain();
    tensionGain.gain.value = 0;
    tension.connect(tensionGain);
    tensionGain.connect(master);
    tension.start();
    this._nodes = { c, master, noise, noiseFilter, noiseGain, droneFilter, droneGain, oscs: [], tension, tensionGain };
  },
  stop() {
    const n = this._nodes;
    this._setPulse(0);
    if (!n) return;
    this._nodes = null;
    this._theme = null;
    try {
      n.master.gain.setTargetAtTime(0, n.c.currentTime, 0.2);
      setTimeout(() => {
        [n.noise, n.tension, ...n.oscs].forEach(o => {
          try { o.stop(); } catch (e) {}
        });
        n.master.disconnect();
      }, 900);
    } catch (e) {}
  },
  _setTheme(id) {
    const n = this._nodes;
    if (this._theme === id) return;
    this._theme = id;
    const t = BGM_THEMES[id], now = n.c.currentTime;
    n.oscs.forEach(o => {
      try { o.stop(now + 1.5); } catch (e) {}
    });
    n.oscs = t.notes.flatMap(f => [f, f * 1.004].map(freq => {
      const o = n.c.createOscillator();
      o.type = t.wave;
      o.frequency.value = freq;
      o.connect(n.droneFilter);
      o.start();
      return o;
    }));
    n.noiseFilter.frequency.setTargetAtTime(t.noise, now, 0.8);
  },
  _setPulse(bpm) {
    if (bpm === this._bpm) return;
    this._bpm = bpm;
    if (this._beat !== null) clearInterval(this._beat);
    this._beat = null;
    if (!bpm) return;
    const thump = () => {
      if (!this._nodes) return;
      try {
        SFX._tone(52, 0, 0.16, 0.12, "sine");
        SFX._tone(46, 0.22, 0.2, 0.08, "sine");
      } catch (e) {}
    };
    thump();
    this._beat = setInterval(thump, Math.round(60000 / bpm));
  },
  apply(mood) {
    const n = this._nodes;
    if (!n || !mood) return;
    try {
      this._setTheme(mood.theme);
      const t = BGM_THEMES[mood.theme], now = n.c.currentTime;
      n.droneGain.gain.setTargetAtTime(0.03 * mood.drone, now, mood.drone ? 1.2 : 0.25);
      n.noiseGain.gain.setTargetAtTime(t.noiseGain * mood.rain, now, 0.6);
      n.tension.frequency.setTargetAtTime(41 + 14 * mood.tension, now, 0.9);
      n.tensionGain.gain.setTargetAtTime(0.06 * mood.tension, now, mood.tension ? 0.9 : 0.3);
      this._setPulse(mood.pulse);
    } catch (e) {}
  }

  tutorial: {

    en: ["⓪ A check is a high jump. The DC is the bar, the die is that day's luck, the modifier is your usual skill — together they clear the bar.", "① Roll a twenty-sided die (d20). Every face from 1 to 20 is equally likely.", "② Add your ability modifier. Modifier = floor((score − 10) ÷ 2).", "③ If you're proficient in the skill, add +2.", "★ A 20 always succeeds. A 1 always fails. Ren's telegraphed attacks automatically hit on 20 but gain no critical damage."]

  abilityMod: s => Math.floor((s - 10) / 2),

function buildEnding1(flags) {
  const has = f => flags.includes(f);
  const ko = [], en = [];
  if (has("signal")) {
    ko.push("렌즈 없는 봉화를 따라, 어선 셋이 간신히 암초를 비켜 들어온다.");
    en.push("Following a beacon with no lens, three fishing boats just clear the rocks.");
    ko.push("도굴꾼은 렌즈를 들고 사라졌다. 그의 말만 남았다 — '기관은 이미 박살 나 있었어.'");
    en.push("The grave-robber vanished with the lens. Only his words remain — \"The mechanism was already smashed.\"");
  } else {
    ko.push(has("lensCracked") ? "금 간 렌즈의 빛이 가까스로 수평선에 닿는다. 어선 셋이 뱃머리를 돌린다." : "수평선 너머, 어선 셋이 등대를 향해 뱃머리를 돌린다.");
    en.push(has("lensCracked") ? "Light through the cracked lens barely reaches the horizon. Three fishing boats turn their bows." : "Beyond the horizon, three fishing boats turn their bows toward the lighthouse.");
    const ren = has("peaceful") ? ["도굴꾼은 피 없이 떠났다.", "The grave-robber left without bloodshed."]
      : has("caughtRen") ? ["붙잡아 준 손을, 도굴꾼은 아마 잊지 못할 것이다.", "The grave-robber probably won't forget the hand that caught him."]
      : has("keptLens") ? ["절뚝이며 떠난 도굴꾼은 원한을 품었을 것이다.", "The grave-robber limped away, and likely holds a grudge."]
      : ["핏자국은 비가 지울 것이다.", "The rain will wash the blood away."];
    ko.push(ren[0] + " 그의 말이 남는다 — '기관은 이미 박살 나 있었어.'");
    en.push(ren[1] + " His words remain — \"The mechanism was already smashed.\"");
  }
  if (has("wired")) {
    ko.push("철사로 동여맨 톱니는 단단히 버틴다 — 적어도 오늘 밤은.");
    en.push("The wire-lashed gear holds firm — for tonight, at least.");
  } else if (!has("fixed") && !has("signal")) {
    ko.push("임시로 돌린 기관은 언제 또 멈출지 모른다.");
    en.push("The jury-rigged mechanism could seize again at any time.");
  }
  ko.push(has("sabotage") ? "그리고 {이름}, 너는 안다. 톱니는 빠진 게 아니라 — 빼낸 것이다. 처음 멈춘 자는 아직 어딘가에 있다." : "처음 등대를 멈춘 자는, 아직 어딘가에 있다.");
  en.push(has("sabotage") ? "And {name}, you know. The gear wasn't missing — it was pulled out. Whoever stopped it first is still out there." : "Whoever stopped the lighthouse first is still out there.");
  ko.push("\n— 제1장 「잿빛 등대」 끝.");
  en.push("\n— End of Chapter 1, \"The Ashen Lighthouse.\"");
  return bi(ko.join("\n\n"), en.join("\n\n"));
}

      telemetry: telemetryRun ? {id: telemetryRun.id, seq: telemetryRun.seq} : undefined,
      savedAt: Date.now()
    };
    store.set(SAVE_KEY, snapshot);
    setSavedGame(snapshot);
  }, [sceneKey, pc, flags, stats, fate, specialLeft, breathLeft, ruleKey, tutSeen, rolling, pending, telemetryRun]);
  // 회차가 끝나면(엔딩·게임오버) 이어하기 기록을 비운다. 엔딩 도감(badges)은 별도로 영구 보관된다.
  useEffect(() => {
    if (pc && scene && (scene.ending || scene.gameover)) {
      store.remove(SAVE_KEY);
      setSavedGame(null);
    }
  }, [sceneKey, pc]);
  // 엔딩 도달 시 — 이 엔딩의 최고 기록(성공률 우선, 동률이면 최소 판정)을 갱신하고 오늘의 도전 달성을 판정한다.
  useEffect(() => {
    if (!pc || !scene || !scene.ending) return;
    const rolls = stats.rolls;
    const success = stats.success;
    const rate = rolls ? Math.round(success / rolls * 100) : 0;
    const bId = badgeId(scene.ending, flags);
    const cur = records[bId];
    const better = !cur || rate > cur.rate || rate === cur.rate && rolls < cur.rolls;
    if (better) {
      const next = {
        ...records,
        [bId]: {
          rolls,
          success,
          rate,
          hp: pc.hp,
          maxHp: pc.maxHp,
          ruleKey,
          at: Date.now()
        }
      };
      store.set("aduventure_records", next);
      setRecords(next);
      setRecordFlash(bId);
    } else {
      setRecordFlash(null);
    }
    if (!dailyDone && daily.test({
      classKey: pc.classKey,
      ruleKey,
      rate,
      rolls,
      hp: pc.hp,
      maxHp: pc.maxHp,
      ending: scene.ending
    })) {
      store.set("aduventure_daily_" + todayKey, true);
      setDailyDone(true);
    }
    const newArts = Object.keys(ARTIFACTS).filter(id => ARTIFACTS[id].got(flags) && !artifacts.includes(id));
    if (newArts.length) {
      const nextA = [...artifacts, ...newArts];
      store.set("aduventure_artifacts", nextA);
      setArtifacts(nextA);
      setArtifactFlash(newArts);
    } else {
      setArtifactFlash(null);
    }
  }, [sceneKey, pc]);
  // 비대칭 영속성 — 회차 중 발견한 단서(CLUES)는 '지식'으로 회차를 넘어 영구 축적된다.
  // 실패·게임오버로 회차가 끝나도 지식은 남아, 다음 회차에서 새 선택지(loreReq)를 연다.
  useEffect(() => {
    const found = flags.filter(f => CLUES[f] || FRAGMENTS[f]);
    if (!found.length) return;
    setLore(prev => {
      const next = [...new Set([...prev, ...found])];
      if (next.length === prev.length) return prev;
      store.set("aduventure_lore", next);
      return next;
    });
  }, [flags]);
  function unlock(id) {
    if (badges.includes(id)) {
      setNewBadge(null);
      return;
    }
    const next = [...badges, id];
    setBadges(next);
    setNewBadge(id);
    store.set("aduventure_badges", next);
  }
  function unlockLater(ending, f) {
    setTimeout(() => unlock(badgeId(ending, f)), 0);
  }
  function pickClass(key) {
    const c = CLASSES[key];
    const run = newTelemetryRun(restartFrom.current);
    setTelemetryRun(run);
    emitTelemetry("run_start", run, {scene_id: "intro", lang, rule: ruleKey, class: key, reason: restartFrom.current ? "restart" : "new", previous_run_id: restartFrom.current || undefined});
    restartFrom.current = null;
    setPc({
      ...c,
      classKey: key,
      hp: c.maxHp,
      name: nameInput.trim() || (lang === "en" ? "Nameless Hero" : "이름 없는 용사")
    });
    setFate(1);
    setSpecialLeft(2);
  }
  function goto(key, extraFlag) {
    setShowCalc(false);
    setPending(null);
    const target = SCENES[key];
    const extras = [].concat(extraFlag || []);
    // 렌 전투에서 함정을 쓰면 철사가 사라진다 — 저장·복원 후에도 유지되도록 회차 플래그로 남긴다.
    if (scene?.enemy === "looter" && trapUsed) setFlags(f => f.includes("wireUsed") ? f : [...f, "wireUsed"]);
    if (target?.revive) {
      setPc(p => ({
        ...p,
        hp: Math.max(p.hp, target.revive)
      }));
      emitTelemetry("defeat_continue", telemetryRun, {scene_id: sceneKey, to_scene: key, lang, rule: ruleKey, class: pc?.classKey});
    }
    if (target?.combat) {
      const e = ENEMIES[target.enemy];
      setEnemy({
        ...e,
        hp: e.maxHp
      });
      setClog([{
        who: "sys",
        t: bi("⚔ 전투 개시 — " + e.name.ko, "⚔ Battle — " + e.name.en)
      }]);
      setBreathLeft(1);
      setGuardBonus(0);
      setDisruptReady(true);
      if (target.enemy === "looter") {
        setTrapUsed(false);
        setEnemyIntent(rollLooterIntent(e.maxHp, e.maxHp));
      }
    }
    if (key === "intro2" || key === "intro3") {
      setPc(p => ({
        ...p,
        hp: p.maxHp
      }));
      setFate(1);
      setSpecialLeft(2);
      setLastResult(null);
    }
    if (target?.ending) {
      emitTelemetry("chapter_clear", telemetryRun, {scene_id: key, chapter: target.ch, lang, rule: ruleKey, class: pc?.classKey});
      setFlags(f => {
        const all = [...f, ...extras.filter(x => !f.includes(x))];
        unlockLater(target.ending, all);
        return f;
      });
    }
    if (target?.gameover) emitTelemetry("death", telemetryRun, {scene_id: sceneKey, to_scene: key, lang, rule: ruleKey, class: pc?.classKey});
    setSceneKey(key);
  }

  // 판정 결과 적용 + 즉시 다음 장면으로 (진행 클릭 제거)
  // res가 null이면 판정 없는 결과 문단(choice.result)이다.
  function applyBranch(branch, res, label) {
    let extra = "";
    const gained = [branch.flag, ...(branch.flags || [])].filter(Boolean);
    if (branch.damage) {
      const dmg = d(branch.damage[1]) + branch.damage[0] - 1;
      setPc(p => ({
        ...p,
        hp: Math.max(0, p.hp - dmg)
      }));
      extra = lang === "en" ? `\n\n(${dmg} damage)` : `\n\n(${dmg} 피해)`;
    }
    if (gained.length) {
      setFlags(f => [...f, ...gained.filter(x => !f.includes(x))]);
      for (const g of gained) {
        if (CLUES[g]) extra += (lang === "en" ? `\n\n✦ Clue found — ${tx(CLUES[g])}` : `\n\n✦ 단서 획득 — ${tx(CLUES[g])}`);
      }
    }
    setLastResult({
      dice: res,
      label,
      text: fmt(tx(branch.text), pc) + extra,
      kind: !res || res.success ? "good" : "bad"
    });
    goto(branch.goto, gained);
  }
  function resolveCheck(choice, fateAvail) {
    setRolling(true);
    setShowCalc(false);
    SFX.dice();
    let t = 0;
    const iv = setInterval(() => {
      setRollFace(d(ruleKey === "srd20" ? 20 : 12));
      if (++t > 9) {
        clearInterval(iv);
        const res = rules.check({
          actor: pc,
          ...choice.check
        });
        setRolling(false);
        setRollFace(null);
        setStats(s => ({
          rolls: s.rolls + 1,
          success: s.success + (res.success ? 1 : 0)
        }));
        if (res.success) {
          SFX.good();
          applyBranch(choice.success, res, choice.check.skill);
        } else if (fateAvail) {
          SFX.bad();
          setPending({
            choice,
            res
          });
        } else {
          SFX.bad();
          applyBranch(choice.fail, res, choice.check.skill);
        }
      }
    }, 70);
  }
  function doChoice(choice) {
    if (!recordDecision(narrativeId(choice))) return;
    setLastResult(null);
    setPending(null);
    if (choice.result) {
      applyBranch(choice.result, null, null);
      return;
    }
    if (!choice.check) {
      if (choice.flagDirect) setFlags(f => [...f, choice.flagDirect]);
      goto(choice.goto, choice.flagDirect);
      return;
    }
    resolveCheck(choice, fate > 0);
  }

  // 전투 — 매 턴이 결정: 공격 / 특수기 / 방어 / 숨 고르기
  // 도굴꾼 전투 시제품 — 적 의도를 보고 대응을 고른다. 얻는 것/감수하는 것이 상황따라 갈린다.
  function looterAction(action) {
    if (!enemy || enemy.done || enemy.playerDown) return;
    if (action === "disrupt" && !disruptReady) return;
    if (action === "trap" && (!flags.includes("sawTrap") || trapUsed)) return;
    if (!["strike", "guard", "disrupt", "trap"].includes(action)) return;
    if (!recordDecision(action)) return;
    // Both success and failure require another action before the next attempt.
    setDisruptReady(action !== "disrupt");
    setLastResult(null);
    const foe = ENEMIES.looter;
    const intent = enemyIntent;
    const log = [];
    let eHp = enemy.hp;
    let curHp = pc.hp;
    let enemyActs = true;
    let incomingMult = 1;
    if (action === "strike") {
      const atk = rules.attack({
        attacker: pc,
        defender: enemy
      });
      setStats(s => ({
        rolls: s.rolls + 1,
        success: s.success + (atk.hit ? 1 : 0)
      }));
      atk.hit ? SFX.good() : SFX.bad();
      eHp = Math.max(0, enemy.hp - (atk.damage + (atk.hit ? guardBonus : 0)));
      log.push({
        who: "you",
        t: bi("▶ " + atk.detail.ko + (guardBonus && atk.hit ? ` (+${guardBonus} 받아넘긴 반격)` : ""), "▶ " + atk.detail.en + (guardBonus && atk.hit ? ` (+${guardBonus} riposte)` : ""))
      });
      if (guardBonus) setGuardBonus(0);
    } else if (action === "guard") {
      SFX.good();
      setGuardBonus(rules.scaleEffect(4));
      log.push({
        who: "you",
        t: bi(`▶ 자세를 낮추고 갈고리를 받아넘길 준비를 한다 — 다음 공격에 +${rules.scaleEffect(4)}`, `▶ You drop your stance, ready to turn the hook — +${rules.scaleEffect(4)} on your next strike`)
      });
      incomingMult = intent === "hook" ? 0.2 : 0.5;
    } else if (action === "disrupt") {
      if (guardBonus) setGuardBonus(0);
      const move = looterDisruptFor(pc.classKey);
      const res = rules.check({
        actor: pc,
        ...move.check
      });
      setStats(s => ({
        rolls: s.rolls + 1,
        success: s.success + (res.success ? 1 : 0)
      }));
      if (res.success) {
        SFX.good();
        const dmg = rules.rollDamage({ die: 6 });
        eHp = Math.max(0, enemy.hp - dmg);
        enemyActs = false;
        log.push({
          who: "you",
          t: move.success(res.roll, dmg)
        });
      } else {
        SFX.bad();
        incomingMult = 1.3;
        log.push({
          who: "you",
          t: move.fail(res.roll)
        });
      }
    } else if (action === "trap") {
      if (guardBonus) setGuardBonus(0);
      setTrapUsed(true);
      SFX.good();
      const dmg = rules.rollDamage({ die: 4, bonus: 2 });
      eHp = Math.max(0, enemy.hp - dmg);
      enemyActs = false;
      log.push({
        who: "you",
        t: bi(`▶ 놈을 쏟긴 기름과 철사 쪽으로 몬다 — 철컥, 발이 걸린다. ${dmg} 피해, 갈고리가 허공을 가른다`, `▶ You drive him into the spilled oil and wire — a click, his foot catches. ${dmg} damage, the hook cuts empty air`)
      });
    }
    if (eHp <= 0) {
      setClog(l => [...l, ...log, {
        who: "sys",
        t: bi("✦ 승리", "✦ Victory")
      }]);
      setEnemy({
        ...enemy,
        hp: 0,
        done: true
      });
      return;
    }
    const half = Math.ceil(foe.maxHp / 2);
    if (enemy.hp > half && eHp <= half) {
      log.push({
        who: "sys",
        t: bi("— 궁지에 몰린 렌이 이빨을 드러낸다. 갈고리질이 거칠어진다.", "— Cornered, Ren bares his teeth. The hook swings wilder.")
      });
    }
    if (enemyActs) {
      const info = LOOTER_INTENTS[intent];
      if (intent === "feint") {
        const heal = rules.rollRecovery({ die: info.heal[1], bonus: info.heal[0] - 1 });
        eHp = Math.min(foe.maxHp, eHp + heal);
        log.push({
          who: "foe",
          t: bi(`◀ 렌: 물러나 숨을 고른다 — HP ${heal} 회복`, `◀ Ren steps back to catch his breath — recovers ${heal} HP`)
        });
      } else {
        const atk = rules.attack({ attacker: foe, defender: pc, damageProfile: { die: info.dmg[1], bonus: info.dmg[0] - 1 } });
        const dmg = Math.max(0, Math.round(atk.damage * incomingMult));
        curHp = Math.max(0, curHp - dmg);
        log.push({
          who: "foe",
          t: bi(`◀ 렌의 ${info.label.ko} — ${atk.hit ? `${dmg} 피해${incomingMult < 1 ? " (막아냈다)" : incomingMult > 1 ? " (빈틈을 찔렸다)" : ""}` : `빗나감 (방어 ${pc.ac})`}`, `◀ Ren's ${info.label.en} — ${atk.hit ? `${dmg} damage${incomingMult < 1 ? " (blocked)" : incomingMult > 1 ? " (caught in the open)" : ""}` : `miss (AC ${pc.ac})`}`)
        });
      }
    }
    setPc({
      ...pc,
      hp: curHp
    });
    setEnemy({
      ...enemy,
      hp: eHp,
      playerDown: curHp <= 0
    });
    setClog(l => [...l, ...log]);
    setEnemyIntent(rollLooterIntent(eHp, foe.maxHp));
  }
  function combatAction(action) {
    if (!enemy || enemy.done || enemy.playerDown) return;
    if (!["attack", "special", "defend", "breath"].includes(action)) return;
    if (action === "special" && specialLeft <= 0) return;
    if (action === "breath" && breathLeft <= 0) return;
    if (!recordDecision(action)) return;
    setLastResult(null);
    const foe = ENEMIES[scene.enemy];
    const log = [];
    let eHp = enemy.hp;
    let curHp = pc.hp;
    const isDef = action === "defend";
    if (action === "attack" || action === "special") {
      let atk;
      if (action === "special") {
        setSpecialLeft(n => n - 1);
        if (pc.classKey === "wizard") {
          const dmg = rules.rollDamage({ die: 8, bonus: 2 });
          atk = {
            hit: true,
            damage: dmg,
            detail: bi(`마법 화살 — 빗나갈 수 없는 빛, ${dmg} 피해`, `Magic Missile — a light that cannot miss, ${dmg} damage`)
          };
        } else if (pc.classKey === "rogue") {
          const base = rules.attack({
            attacker: pc,
            defender: enemy
          });
          atk = base.hit ? {
            ...base,
            damage: base.damage * 2,
            detail: bi(`급소 찌르기! ${base.detail.ko} → 피해 2배 = ${base.damage * 2}`, `Vital Strike! ${base.detail.en} → double damage = ${base.damage * 2}`)
          } : {
            ...base,
            detail: bi("급소 찌르기 — " + base.detail.ko, "Vital Strike — " + base.detail.en)
          };
        } else {
          const base = rules.attack({
            attacker: pc,
            defender: {
              ...enemy,
              ac: enemy.ac + 2
            }
          });
          if (base.hit) {
            const bonus = rules.rollDamage({ die: 6 });
            atk = {
              ...base,
              damage: base.damage + bonus,
              detail: bi(`강타! ${base.detail.ko} +추가 ${bonus}`, `Power Strike! ${base.detail.en} +${bonus} extra`)
            };
          } else atk = {
            ...base,
            detail: bi("강타 — 크게 휘둘렀지만 " + base.detail.ko, "Power Strike — a wide swing, but " + base.detail.en)
          };
        }
      } else {
        atk = rules.attack({
          attacker: pc,
          defender: enemy
        });
        if (guardBonus && atk.hit) {
          atk = {
            ...atk,
            damage: atk.damage + guardBonus,
            detail: bi(`${atk.detail.ko} (+${guardBonus} 방어 후 반격)`, `${atk.detail.en} (+${guardBonus} defensive riposte)`)
          };
        }
      }
      if (guardBonus) setGuardBonus(0);
      setStats(s => ({
        rolls: s.rolls + 1,
        success: s.success + (atk.hit ? 1 : 0)
      }));
      if (atk.hit) SFX.good();else SFX.bad();
      eHp = Math.max(0, enemy.hp - atk.damage);
      log.push({
        who: "you",
        t: bi("▶ " + atk.detail.ko, "▶ " + atk.detail.en)
      });
      if (eHp <= 0) {
        setClog(l => [...l, ...log, {
          who: "sys",
          t: bi("✦ 승리", "✦ Victory")
        }]);
        setEnemy({
          ...enemy,
          hp: 0,
          done: true
        });
        return;
      }
    } else if (isDef) {
      setGuardBonus(rules.scaleEffect(4));
      log.push({
        who: "you",
        t: bi(`▶ 방어 — 이번 공격 AC ${pc.ac} → ${pc.ac + 4}. 맞으면 피해량은 그대로다. 다음 기본 공격에 피해 +${rules.scaleEffect(4)} 준비(중첩 없음)`, `▶ Defend — AC ${pc.ac} → ${pc.ac + 4} for this attack. A hit still deals full damage. Next basic attack: +${rules.scaleEffect(4)} damage ready (does not stack)`)
      });
    } else if (action === "breath") {
      if (guardBonus) setGuardBonus(0);
      setBreathLeft(0);
      const heal = rules.rollRecovery({ die: 4 });
      curHp = Math.min(pc.maxHp, curHp + heal);
      log.push({
        who: "you",
        t: bi(`▶ 거리를 벌리고 숨을 고른다 — HP ${heal} 회복`, `▶ You give ground and catch your breath — recover ${heal} HP`)
      });
    }
    const def = rules.attack({
      attacker: foe,
      defender: {
        ...pc,
        ac: isDef ? pc.ac + 4 : pc.ac
      }
    });
    log.push({
      who: "foe",
      t: bi("◀ " + (foe.name.ko || foe.name) + ": " + def.detail.ko + (isDef ? " (방어 태세)" : ""), "◀ " + (foe.name.en || foe.name) + ": " + def.detail.en + (isDef ? " (guarding)" : ""))
    });
    curHp = Math.max(0, curHp - def.damage);
    setPc({
      ...pc,
      hp: curHp
    });
    setEnemy({
      ...enemy,
      hp: eHp,
      playerDown: curHp <= 0
    });
    setClog(l => [...l, ...log]);
  }
  function restart(toScene) {
    emitTelemetry("run_restart", telemetryRun, {scene_id: sceneKey, to_scene: toScene || "intro", reason: scene?.gameover ? "death" : "replay"});
    restartFrom.current = telemetryRun?.id || null;
    if (toScene) {
      const nextRun = newTelemetryRun(restartFrom.current);
      setTelemetryRun(nextRun);
      emitTelemetry("run_start", nextRun, {scene_id: toScene, lang, rule: ruleKey, class: pc?.classKey, reason: "restart", previous_run_id: restartFrom.current || undefined});
      restartFrom.current = null;
    } else setTelemetryRun(null);
    setSceneKey(toScene || "intro");
    setRolling(false);
    setRollFace(null);
    setLastResult(null);
    setPending(null);
    setShowCalc(false);
    setFlags([]);
    setStats({
      rolls: 0,
      success: 0
    });
    setEnemy(null);
    setEnemyIntent(null);
    setTrapUsed(false);
    setGuardBonus(0);
    setDisruptReady(true);
    setClog([]);
    setNewBadge(null);
    setRecordFlash(null);
    setArtifactFlash(null);
    setFate(1);
    setSpecialLeft(2);
    setBreathLeft(1);
    if (toScene) setPc(p => ({
      ...p,
      hp: p.maxHp
    }));else {
      setPc(null);
      store.remove(SAVE_KEY);
      setSavedGame(null);
    }
  }
  // 이어서 하기 — 저장된 진행 상태를 복원한다. 임시 상태(전투·판정·직전 결과)는 초기화한다.
  function continueGame() {
    const s = savedGame || store.get(SAVE_KEY);
    if (!s || !s.pc) return;
    const run = restoreTelemetryRun(s.telemetry);
    setTelemetryRun(run);
    emitTelemetry("run_continue", run, {scene_id: s.sceneKey, seq: run.seq, lang, rule: s.ruleKey || "srd20", class: s.pc.classKey, legacy_save: !s.telemetry});
    setRuleKey(s.ruleKey || "srd20");
    setPc(s.pc);
    setFlags(s.flags || []);
    setStats(s.stats || {
      rolls: 0,
      success: 0
    });
    setFate(typeof s.fate === "number" ? s.fate : 1);
    setSpecialLeft(typeof s.specialLeft === "number" ? s.specialLeft : 2);
    setBreathLeft(typeof s.breathLeft === "number" ? s.breathLeft : 1);
    setTutSeen(!!s.tutSeen);
    setEnemy(null);
    setEnemyIntent(null);
    setTrapUsed(false);
    setGuardBonus(0);
    setDisruptReady(true);
    setClog([]);
    setLastResult(null);
    setPending(null);
    setShowCalc(false);
    setNewBadge(null);
    setRolling(false);
    setRollFace(null);
    setSceneKey(s.sceneKey || "intro");
  }
  const pct = choice => Math.round(rules.successChance({
    actor: pc,
    ...choice.check
