# 평소 Pages는 main 브랜치(legacy)를 쓴다. Source를 GitHub Actions로 바꾼 뒤에만 수동 실행한다.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp letter.html _site/letter.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
